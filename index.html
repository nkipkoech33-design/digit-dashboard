                let candleStore = {};
                let _srCache = {};
                // Track signal state per symbol per market type to avoid flicker
                let _signalCache = {};

                // ---- CREATE CARDS IMMEDIATELY ----
                function createAllCards() {
                    const container = document.getElementById('marketsContainer');
                    container.innerHTML = '';
                    ALL_SYMBOLS.forEach(s => createMarketUI(s, MARKET_NAMES[s]));
                }

                // ---- CANDLE FUNCTIONS ----
                function getCandle(sym) {
                    if (!candleStore[sym]) {
                        candleStore[sym] = {
                            open: null,
                            high: null,
                            low: null,
                            close: null,
                            minute: null,
                            tickCount: 0,
                            isClosed: false,
                            history: []
                        };
                    }
                    return candleStore[sym];
                }

                function updateCandle(sym, price) {
                    const now = Date.now();
                    const minute = Math.floor(now / 60000) * 60000;
                    const candle = getCandle(sym);
                    if (candle.isClosed || candle.minute !== minute) {
                        if (candle.open !== null && candle.minute !== null) {
                            candle.history.push({ ...candle });
                            if (candle.history.length > 1500) candle.history.shift();
                        }
                        candle.open = price;
                        candle.high = price;
                        candle.low = price;
                        candle.close = price;
                        candle.minute = minute;
                        candle.tickCount = 1;
                        candle.isClosed = false;
                        return candle;
                    }
                    if (price > candle.high) candle.high = price;
                    if (price < candle.low) candle.low = price;
                    candle.close = price;
                    candle.tickCount++;
                    return candle;
                }

                function closeCandleIfNeeded(sym) {
                    const now = Date.now();
                    const candle = getCandle(sym);
                    if (!candle.open) return;
                    const currentMinute = Math.floor(now / 60000) * 60000;
                    if (candle.minute !== currentMinute && !candle.isClosed) {
                        candle.isClosed = true;
                        candle.history.push({ ...candle });
                        if (candle.history.length > 1500) candle.history.shift();
                        const price = candle.close;
                        const newMinute = Math.floor(now / 60000) * 60000;
                        candle.open = price;
                        candle.high = price;
                        candle.low = price;
                        candle.close = price;
                        candle.minute = newMinute;
                        candle.tickCount = 0;
                        candle.isClosed = false;
                    }
                }

                function getCandleChange(candle) {
                    if (!candle || candle.open === null || candle.close === null) return { change: 0, pct: 0, direction: 'flat' };
                    const change = candle.close - candle.open;
                    const pct = candle.open !== 0 ? (change / candle.open) * 100 : 0;
                    const direction = change > 0 ? 'up' : change < 0 ? 'down' : 'flat';
                    return { change, pct, direction };
                }

                function getSettings() {
                    return {
                        pointerStyle: document.getElementById('pointerStyle')?.value || 'triangle',
                        pointerScale: parseFloat(document.getElementById('pointerScale')?.value || 3),
                        analysisWindow: parseInt(document.getElementById('analysisWindow')?.value) || 1000,
                        predThreshold: parseFloat(document.getElementById('predThreshold')?.value) || 19,
                        oppositeThreshold: parseFloat(document.getElementById('oppositeThreshold')?.value) || 10,
                        streakThreshold: parseFloat(document.getElementById('streakThreshold')?.value) || 70,
                        hybridThreshold: parseFloat(document.getElementById('hybridThreshold')?.value) || 65,
                        highlightColor: document.getElementById('highlightColor')?.value || '#7e22ce',
                        alarmCooldown: parseInt(document.getElementById('alarmCooldown')?.value) || 10,
                        zoneWindow: parseInt(document.getElementById('zoneWindow')?.value) || 50,
                        analysisRangeWindow: parseInt(document.getElementById('analysisRangeWindow')?.value) || 50,
                        densityWindow: parseInt(document.getElementById('densityWindow')?.value) || 300,
                        densityThreshold: parseFloat(document.getElementById('densityThreshold')?.value) || 45,
                        ouThreshold: parseFloat(document.getElementById('ouThreshold')?.value) || 18
                    };
                }

                function lastDigitFromFormatted(s) {
                    let d = s.replace(/\./g, '');
                    return d.length ? parseInt(d.charAt(d.length - 1), 10) : 0;
                }

                function formatHistoryPrice(s, p) {
                    return p.toFixed(DECIMAL_MAP[s] ?? 2);
                }

                // ---- ZONE MEMORY (unchanged) ----
                function computeZoneMemory(digits, windowSize) {
                    if (!digits || digits.length < 2) return null;
                    const slice = digits.slice(-windowSize);
                    const zones = { under: 0, middle: 0, over: 0 };
                    const zoneMap = d => d <= 3 ? 'under' : d <= 5 ? 'middle' : 'over';
                    for (let d of slice) zones[zoneMap(d)]++;
                    const total = slice.length;
                    const pct = {
                        under: (zones.under / total) * 100,
                        middle: (zones.middle / total) * 100,
                        over: (zones.over / total) * 100
                    };
                    let currentZone = zoneMap(digits[digits.length - 1]);
                    let streak = 0;
                    for (let i = digits.length - 1; i >= 0; i--) {
                        if (zoneMap(digits[i]) === currentZone) streak++;
                        else break;
                    }
                    let stats3 = { breakout: 0, bounce: 0, total: 0 };
                    let stats6 = { bounce: 0, breakout: 0, total: 0 };
                    for (let i = 0; i < digits.length - 1; i++) {
                        const d = digits[i],
                            next = digits[i + 1];
                        if (d === 3) {
                            stats3.total++;
                            if (next >= 4 && next <= 5) stats3.breakout++;
                            else if (next >= 0 && next <= 2) stats3.bounce++;
                        }
                        if (d === 6) {
                            stats6.total++;
                            if (next >= 7 && next <= 9) stats6.breakout++;
                            else if (next >= 4 && next <= 5) stats6.bounce++;
                        }
                    }
                    return { pct, currentZone, streak, stats3, stats6, total };
                }

                function computeHistoricalDensity(digits, windowSize) {
                    if (!digits || digits.length < 10) return null;
                    const slice = digits.slice(-windowSize);
                    let under = 0,
                        middle = 0,
                        over = 0;
                    for (let d of slice) {
                        if (d <= 3) under++;
                        else if (d <= 5) middle++;
                        else over++;
                    }
                    const total = slice.length || 1;
                    return { under: (under / total) * 100, middle: (middle / total) * 100, over: (over / total) * 100 };
                }

                function getMemoryReminder(currentDigit, density, threshold) {
                    if (!density) return null;
                    const zoneMap = d => d <= 3 ? 'under' : d <= 5 ? 'middle' : 'over';
                    const currentZone = zoneMap(currentDigit);
                    const val = density[currentZone];
                    if (val > threshold) {
                        const label = currentZone.charAt(0).toUpperCase() + currentZone.slice(1);
                        return `🔁 Memory Zone: ${label} (${val.toFixed(0)}% historical)`;
                    }
                    return null;
                }

                function getPriceZones(prices, windowSize) {
                    if (!prices || prices.length < windowSize) return null;
                    const slice = prices.slice(-windowSize);
                    const high = Math.max(...slice);
                    const low = Math.min(...slice);
                    const range = high - low;
                    if (range === 0) return null;
                    const third = range / 3;
                    return {
                        high, low,
                        under: low + third,
                        middle: low + 2 * third,
                        over: high,
                        getZone: (price) => {
                            if (price <= low + third) return 0;
                            if (price <= low + 2 * third) return 1;
                            return 2;
                        },
                        getZoneLabel: (idx) => ['Under', 'Middle', 'Over'][idx]
                    };
                }

                function computeDigitDominance(prices, digits, zones, windowSize = 200) {
                    if (!prices || !digits || prices.length < 5 || !zones) return null;
                    const len = Math.min(prices.length, windowSize);
                    const start = prices.length - len;
                    const zoneCounts = [Array(10).fill(0), Array(10).fill(0), Array(10).fill(0)];
                    let counts = [0, 0, 0];
                    for (let i = start; i < prices.length; i++) {
                        const price = prices[i];
                        const digit = digits[i];
                        if (digit === undefined || digit === null) continue;
                        const zoneIdx = zones.getZone(price);
                        if (zoneIdx >= 0 && zoneIdx < 3) {
                            zoneCounts[zoneIdx][digit]++;
                            counts[zoneIdx]++;
                        }
                    }
                    const result = {};
                    const zoneLabels = ['under', 'middle', 'over'];
                    for (let z = 0; z < 3; z++) {
                        const total = counts[z];
                        if (total === 0) {
                            result[zoneLabels[z]] = { digit: '?', pct: 0 };
                            continue;
                        }
                        let maxCount = 0,
                            bestDigit = 0;
                        for (let d = 0; d < 10; d++) {
                            if (zoneCounts[z][d] > maxCount) {
                                maxCount = zoneCounts[z][d];
                                bestDigit = d;
                            }
                        }
                        result[zoneLabels[z]] = { digit: bestDigit, pct: (maxCount / total) * 100 };
                    }
                    return result;
                }

                // ---- STABILITY & CONDITION ----
                function getDigitStability(sym) {
                    let data = marketData[sym];
                    if (!data || !data.rollingArray || data.rollingArray.length < 10) return null;
                    let arr = data.rollingArray.slice(-50);
                    if (arr.length < 2) return null;
                    let totalDiff = 0;
                    for (let i = 1; i < arr.length; i++) totalDiff += Math.abs(arr[i] - arr[i - 1]);
                    let avgDiff = totalDiff / (arr.length - 1);
                    let label, cssClass;
                    if (avgDiff < 1.5) { label = 'Stable';
                        cssClass = 'stable'; } else if (avgDiff < 3.5) { label = 'Moderate';
                        cssClass = 'moderate'; } else { label = 'Erratic';
                        cssClass = 'erratic'; }
                    return { avgDiff, label, cssClass };
                }

                function getMarketCondition(sym) {
                    let data = marketData[sym];
                    if (!data || !data.rollingArray || data.rollingArray.length < 20) return null;
                    let arr = data.rollingArray.slice(-20);
                    let up = 0,
                        down = 0;
                    for (let i = 1; i < arr.length; i++) {
                        if (arr[i] > arr[i - 1]) up++;
                        else if (arr[i] < arr[i - 1]) down++;
                    }
                    let stab = getDigitStability(sym);
                    if (stab && stab.label === 'Erratic') return { label: 'Ranging', cssClass: 'ranging' };
                    let diff = up - down;
                    if (diff >= 3) return { label: 'Uptrend', cssClass: 'uptrend' };
                    if (diff <= -3) return { label: 'Downtrend', cssClass: 'downtrend' };
                    return { label: 'Ranging', cssClass: 'ranging' };
                }

                // ---- S/R WITH ROLE REVERSAL ----
                function detectSupportResistanceV2(sym) {
                    const data = marketData[sym];
                    if (!data) return null;
                    const candle = getCandle(sym);
                    let closes = [];
                    if (candle.history && candle.history.length > 0) {
                        closes = candle.history.map(c => c.close);
                    }
                    if (candle.close !== null) closes.push(candle.close);
                    if (closes.length < 100) {
                        if (data.priceHistory && data.priceHistory.length > 100) {
                            closes = data.priceHistory.slice(-1000);
                        } else {
                            return null;
                        }
                    }
                    let prices = closes;
                    if (prices.length > 1000) prices = closes.slice(-1000);
                    const lookback = Math.min(8, Math.floor(prices.length / 20));
                    const tolerance = 0.003;
                    let highs = [],
                        lows = [];
                    for (let i = lookback; i < prices.length - lookback; i++) {
                        let isHigh = true,
                            isLow = true;
                        for (let j = i - lookback; j <= i + lookback; j++) {
                            if (j === i) continue;
                            if (prices[j] >= prices[i]) isHigh = false;
                            if (prices[j] <= prices[i]) isLow = false;
                        }
                        if (isHigh) highs.push(prices[i]);
                        if (isLow) lows.push(prices[i]);
                    }

                    function cluster(values) {
                        if (!values.length) return [];
                        const sorted = values.slice().sort((a, b) => a - b);
                        const clusters = [];
                        let currentCluster = [sorted[0]];
                        for (let i = 1; i < sorted.length; i++) {
                            const diff = (sorted[i] - sorted[i - 1]) / sorted[i - 1];
                            if (diff < tolerance) currentCluster.push(sorted[i]);
                            else {
                                clusters.push(currentCluster);
                                currentCluster = [sorted[i]];
                            }
                        }
                        if (currentCluster.length) clusters.push(currentCluster);
                        return clusters.map(cl => ({
                            level: cl.reduce((a, b) => a + b, 0) / cl.length,
                            count: cl.length
                        }));
                    }
                    const highClusters = cluster(highs);
                    const lowClusters = cluster(lows);
                    const sortByCount = (a, b) => b.count - a.count;
                    const resistanceLevels = highClusters.sort(sortByCount).slice(0, 3);
                    const supportLevels = lowClusters.sort(sortByCount).slice(0, 3);
                    return {
                        resistance: resistanceLevels,
                        support: supportLevels,
                        currentPrice: data.lastPrice
                    };
                }

                function updateSRCache(sym) {
                    const data = marketData[sym];
                    if (!data) return;
                    const newSR = detectSupportResistanceV2(sym);
                    if (!newSR) return;
                    const currentPrice = data.lastPrice;
                    const cache = _srCache[sym] || {
                        levels: { resistance: [], support: [] },
                        lastUpdate: 0,
                        tickCount: 0
                    };
                    let resLevels = cache.levels?.resistance || [];
                    let supLevels = cache.levels?.support || [];
                    if (resLevels.length === 0 && supLevels.length === 0) {
                        resLevels = newSR.resistance.map(r => ({ level: r.level, count: r.count, broken: false,
                            reversedFrom: null, originalType: 'resistance' }));
                        supLevels = newSR.support.map(r => ({ level: r.level, count: r.count, broken: false,
                            reversedFrom: null, originalType: 'support' }));
                    } else {
                        for (let r of resLevels) {
                            if (currentPrice > r.level) {
                                r.broken = true;
                                const existsInSupport = supLevels.some(s => Math.abs(s.level - r.level) / r.level < 0.003);
                                if (!existsInSupport) {
                                    supLevels.push({ level: r.level, count: r.count, broken: false,
                                        reversedFrom: 'resistance', originalType: 'resistance' });
                                }
                            } else {
                                r.broken = false;
                            }
                        }
                        for (let s of supLevels) {
                            if (currentPrice < s.level) {
                                s.broken = true;
                                const existsInResistance = resLevels.some(r => Math.abs(r.level - s.level) / s.level < 0.003);
                                if (!existsInResistance) {
                                    resLevels.push({ level: s.level, count: s.count, broken: false,
                                        reversedFrom: 'support', originalType: 'support' });
                                }
                            } else {
                                s.broken = false;
                            }
                        }
                        for (let newR of newSR.resistance) {
                            const existing = resLevels.find(r => Math.abs(r.level - newR.level) / newR.level < 0.003);
                            if (existing) {
                                existing.count = Math.max(existing.count, newR.count);
                                if (currentPrice < existing.level) existing.broken = false;
                            } else {
                                resLevels.push({ level: newR.level, count: newR.count, broken: false,
                                    reversedFrom: null, originalType: 'resistance' });
                            }
                        }
                        for (let newS of newSR.support) {
                            const existing = supLevels.find(s => Math.abs(s.level - newS.level) / newS.level < 0.003);
                            if (existing) {
                                existing.count = Math.max(existing.count, newS.count);
                                if (currentPrice > existing.level) existing.broken = false;
                            } else {
                                supLevels.push({ level: newS.level, count: newS.count, broken: false,
                                    reversedFrom: null, originalType: 'support' });
                            }
                        }
                        resLevels.sort((a, b) => b.count - a.count);
                        supLevels.sort((a, b) => b.count - a.count);
                        if (resLevels.length > 5) resLevels = resLevels.slice(0, 5);
                        if (supLevels.length > 5) supLevels = supLevels.slice(0, 5);
                    }
                    cache.levels = { resistance: resLevels, support: supLevels };
                    cache.lastUpdate = Date.now();
                    cache.tickCount = (cache.tickCount || 0) + 1;
                    _srCache[sym] = cache;
                }

                function getSRLevels(sym) {
                    const cache = _srCache[sym];
                    if (!cache || !cache.levels) return null;
                    const resistance = cache.levels.resistance.map(r => ({ level: r.level, count: r.count, broken: r
                            .broken || false, reversedFrom: r.reversedFrom || null, originalType: r.originalType ||
                            'resistance' }));
                    const support = cache.levels.support.map(s => ({ level: s.level, count: s.count, broken: s.broken ||
                            false, reversedFrom: s.reversedFrom || null, originalType: s.originalType ||
                        'support' }));
                    return { resistance, support };
                }

                function detectSupportResistance(sym) {
                    const cache = _srCache[sym];
                    const shouldUpdate = !cache || !cache.levels || cache.levels.resistance.length === 0 || (cache
                        .tickCount || 0) % 50 === 0;
                    if (shouldUpdate) updateSRCache(sym);
                    const candle = getCandle(sym);
                    if (candle && candle.isClosed) updateSRCache(sym);
                    const levels = getSRLevels(sym);
                    if (!levels) return null;
                    return {
                        resistance: levels.resistance.map(r => ({ level: r.level, count: r.count })),
                        support: levels.support.map(s => ({ level: s.level, count: s.count }))
                    };
                }

                // ---- ALARM - FIXED: only on valid signal ----
                function playAlarm() {
                    try {
                        const ctx = new(window.AudioContext || window.webkitAudioContext)();
                        const oscillator = ctx.createOscillator();
                        const gainNode = ctx.createGain();
                        oscillator.connect(gainNode);
                        gainNode.connect(ctx.destination);
                        oscillator.type = 'sine';
                        oscillator.frequency.value = 800;
                        gainNode.gain.value = 0.3;
                        oscillator.start();
                        setTimeout(() => { oscillator.stop();
                            ctx.close(); }, 200);
                    } catch (e) {}
                }

                // Check if there's a valid signal for this symbol in the current market
                function hasValidSignal(sym) {
                    const sig = getSignal(sym);
                    if (!sig) return false;
                    if (currentMarket === 'predict') return !!(sig && sig.digit !== undefined);
                    if (currentMarket === 'overunder') return !!(sig && sig.side);
                    if (currentMarket === 'evenodd') return !!(sig && sig.side);
                    if (currentMarket === 'hybrid') return !!(sig && sig.bothConfirmed);
                    if (currentMarket === 'vanilla') {
                        if (Array.isArray(sig)) {
                            return sig.some(s => (s.type === 'confluence' && (s.side === 'BUY' || s.side === 'SELL')) ||
                                (s.type === 'vanilla' && (s.side === 'UP' || s.side === 'DOWN')));
                        }
                        return false;
                    }
                    return false;
                }

                function checkAlarm(sym, price) {
                    if (!document.getElementById('alarmToggle').checked) return;
                    const s = getSettings();
                    const now = Date.now();
                    const last = _lastAlarmTime[sym] || 0;
                    if ((now - last) < s.alarmCooldown * 1000) return;

                    // ONLY play alarm if there's a valid signal
                    if (hasValidSignal(sym)) {
                        playAlarm();
                        _lastAlarmTime[sym] = now;
                    }
                }

                // ---- TRANSITION / PERCENTAGE ----
                function getTransitionStats(sym, windowSize) {
                    let data = marketData[sym];
                    if (!data || data.rollingArray.length < windowSize + 1) return null;
                    let arr = data.rollingArray.slice(-(windowSize + 1));
                    let transitions = {};
                    for (let i = 0; i < arr.length - 1; i++) {
                        let from = arr[i],
                            to = arr[i + 1];
                        if (from < 0 || from > 9 || to < 0 || to > 9) continue;
                        let key = from + '->' + to;
                        transitions[key] = (transitions[key] || 0) + 1;
                    }
                    let list = [];
                    for (let key in transitions) {
                        let [f, t] = key.split('->').map(Number);
                        list.push({ from: f, to: t, count: transitions[key], key });
                    }
                    list.sort((a, b) => b.count - a.count);
                    return list;
                }

                function getDigitPercentages(sym, windowSize) {
                    let data = marketData[sym];
                    if (!data || data.rollingArray.length < windowSize) return null;
                    let arr = data.rollingArray.slice(-windowSize);
                    let cnt = Array(10).fill(0);
                    for (let d of arr) cnt[d]++;
                    let total = arr.length;
                    let pct = cnt.map(c => (c / total) * 100);
                    let countMap = {};
                    for (let d = 0; d < 10; d++) {
                        let c = cnt[d];
                        if (!countMap[c]) countMap[c] = [];
                        countMap[c].push(d);
                    }
                    let distinctCounts = Object.keys(countMap).map(Number).sort((a, b) => b - a);
                    let assigned = new Set();
                    let most = new Set(),
                        second = new Set(),
                        least = new Set(),
                        secondLeast = new Set();
                    if (distinctCounts.length > 0) {
                        for (let d of countMap[distinctCounts[0]]) { most.add(d);
                            assigned.add(d); }
                    }
                    if (distinctCounts.length > 1) {
                        for (let i = 1; i < distinctCounts.length; i++) {
                            let digits = countMap[distinctCounts[i]].filter(d => !assigned.has(d));
                            if (digits.length > 0) { for (let d of digits) { second.add(d);
                                    assigned.add(d); } break; }
                        }
                    }
                    let unassignedCounts = distinctCounts.filter(c => countMap[c].some(d => !assigned.has(d))).sort((a,
                        b) => a - b);
                    if (unassignedCounts.length > 0) { for (let d of countMap[unassignedCounts[0]]) { if (!assigned.has(
                                d)) { least.add(d);
                                assigned.add(d); } } }
                    unassignedCounts = distinctCounts.filter(c => countMap[c].some(d => !assigned.has(d))).sort((a, b) => a -
                        b);
                    if (unassignedCounts.length > 0) { for (let d of countMap[unassignedCounts[0]]) { if (!assigned.has(
                                d)) { secondLeast.add(d);
                                assigned.add(d); } } }
                    return { pct, most, second, least, secondLeast };
                }

                function getTopPrediction(sym, currentDigit) {
                    let s = getSettings();
                    let stats = getTransitionStats(sym, s.analysisWindow);
                    if (!stats) return null;
                    let relevant = stats.filter(t => t.from === currentDigit);
                    if (!relevant.length) return null;
                    let best = relevant[0];
                    let totalFrom = relevant.reduce((sum, t) => sum + t.count, 0);
                    if (totalFrom < 5) return null;
                    let percentage = (best.count / totalFrom) * 100;
                    return { nextDigit: best.to, count: best.count, total: totalFrom, percentage };
                }

                function getReversalSignal(sym) {
                    let s = getSettings();
                    let data = marketData[sym];
                    if (!data || data.rollingArray.length < s.analysisWindow) return null;
                    let arr = data.rollingArray.slice(-s.analysisWindow);
                    let counts = Array(10).fill(0);
                    for (let d of arr) counts[d]++;
                    let total = arr.length;
                    let pct = counts.map(c => (c / total) * 100);
                    let odd = [1, 3, 5, 7, 9],
                        even = [0, 2, 4, 6, 8];
                    if (odd.every(d => pct[d] <= s.oppositeThreshold)) return "EVEN";
                    if (even.every(d => pct[d] <= s.oppositeThreshold)) return "ODD";
                    return null;
                }

                function getStreak3Signal(sym) {
                    let data = marketData[sym];
                    if (!data || data.rollingArray.length < 50) return null;
                    let last50 = data.rollingArray.slice(-50);
                    let evenCount = last50.filter(d => d % 2 === 0).length;
                    let evenPct = (evenCount / 50) * 100;
                    let oddPct = 100 - evenPct;
                    let s = getSettings();
                    if (evenPct >= s.streakThreshold) return "EVEN";
                    if (oddPct >= s.streakThreshold) return "ODD";
                    return null;
                }

                // ========== UPDATED: Over/Under Signal Logic with configurable threshold ==========
                function getOverUnderSignal(sym) {
                    let s = getSettings();
                    let freqData = getDigitPercentages(sym, s.analysisWindow);
                    if (!freqData) return null;
                    const pct = freqData.pct;
                    const thresh = s.ouThreshold || 18;

                    const sum01 = pct[0] + pct[1];
                    const sum23 = pct[2] + pct[3];
                    const sum67 = pct[6] + pct[7];
                    const sum89 = pct[8] + pct[9];

                    if (sum01 < thresh && sum23 < thresh) {
                        return {
                            type: 'overunder',
                            side: 'OVER',
                            sum01,
                            sum23,
                            sum67,
                            sum89,
                            threshold: thresh
                        };
                    }

                    if (sum67 < thresh && sum89 < thresh) {
                        return {
                            type: 'overunder',
                            side: 'UNDER',
                            sum67,
                            sum89,
                            sum01,
                            sum23,
                            threshold: thresh
                        };
                    }

                    return null;
                }

                function getEvenOddSignal(sym) {
                    if (currentStrategy === 'reversal') {
                        let rev = getReversalSignal(sym);
                        if (rev) return { type: 'evenodd', side: rev, strategy: 'reversal' };
                    } else {
                        let streak = getStreak3Signal(sym);
                        if (streak) return { type: 'evenodd', side: streak, strategy: 'streak3' };
                    }
                    return null;
                }

                // ---- GMMA + CONFLUENCE ----
                function computeGMMA(closes) {
                    if (!closes || closes.length < 60) return null;
                    const shortPeriods = [3, 5, 8, 10, 12, 15];
                    const longPeriods = [30, 35, 40, 45, 50, 60];
                    const ema = (data, period) => {
                        if (data.length < period) return null;
                        let k = 2 / (period + 1);
                        let emaVal = data.slice(0, period).reduce((a, b) => a + b, 0) / period;
                        for (let i = period; i < data.length; i++) {
                            emaVal = data[i] * k + emaVal * (1 - k);
                        }
                        return emaVal;
                    };
                    const shortEMAs = shortPeriods.map(p => ema(closes, p));
                    const longEMAs = longPeriods.map(p => ema(closes, p));
                    if (shortEMAs.some(v => v === null) || longEMAs.some(v => v === null)) return null;
                    const lastPrice = closes[closes.length - 1];
                    const spread = (shortEMAs[0] - longEMAs[longEMAs.length - 1]) / lastPrice * 100;
                    const allShortAboveLong = shortEMAs.every(s => s > longEMAs[0]);
                    const allShortBelowLong = shortEMAs.every(s => s < longEMAs[0]);
                    const trend = allShortAboveLong && spread > 0.5 ? 'bullish' :
                        allShortBelowLong && spread < -0.5 ? 'bearish' : 'neutral';
                    const shortGroupExpanding = shortEMAs.every((v, i, arr) => i === 0 || v > arr[i - 1]);
                    const longGroupExpanding = longEMAs.every((v, i, arr) => i === 0 || v > arr[i - 1]);
                    const shortGroupContracting = shortEMAs.every((v, i, arr) => i === 0 || v < arr[i - 1]);
                    const longGroupContracting = longEMAs.every((v, i, arr) => i === 0 || v < arr[i - 1]);
                    return { shortEMAs, longEMAs, trend, spread, shortGroupExpanding, longGroupExpanding,
                        shortGroupContracting, longGroupContracting, lastPrice };
                }

                function linearRegressionSlope(prices) {
                    if (prices.length < 2) return 0;
                    const n = prices.length;
                    let sumX = 0,
                        sumY = 0,
                        sumXY = 0,
                        sumX2 = 0;
                    for (let i = 0; i < n; i++) {
                        sumX += i;
                        sumY += prices[i];
                        sumXY += i * prices[i];
                        sumX2 += i * i;
                    }
                    return (n * sumXY - sumX * sumY) / (n * sumX2 - sumX * sumX);
                }

                function getConfluenceProgress(sym) {
                    const data = marketData[sym];
                    if (!data || !data.priceHistory || data.priceHistory.length < 60) return null;
                    const candle = getCandle(sym);
                    let closes = [];
                    if (candle.history && candle.history.length > 0) {
                        closes = candle.history.map(c => c.close);
                    }
                    if (candle.close !== null) closes.push(candle.close);
                    if (closes.length < 60) closes = data.priceHistory.slice(-100);
                    const gmma = computeGMMA(closes);
                    if (!gmma) return null;
                    const sr = detectSupportResistance(sym);
                    if (!sr) return null;
                    const currentPrice = data.lastPrice;
                    let nearestResistance = null,
                        nearestSupport = null;
                    let nearestResistanceDist = Infinity,
                        nearestSupportDist = Infinity;
                    for (let r of sr.resistance) {
                        const dist = r.level - currentPrice;
                        if (dist > 0 && dist < nearestResistanceDist) {
                            nearestResistanceDist = dist;
                            nearestResistance = r.level;
                        }
                    }
                    for (let s of sr.support) {
                        const dist = currentPrice - s.level;
                        if (dist > 0 && dist < nearestSupportDist) {
                            nearestSupportDist = dist;
                            nearestSupport = s.level;
                        }
                    }
                    const recentCloses = closes.slice(-30);
                    const slope = linearRegressionSlope(recentCloses);
                    const trendDirection = slope > 0.001 ? 'up' : slope < -0.001 ? 'down' : 'flat';
                    let trendLineValue = recentCloses[recentCloses.length - 1];
                    if (recentCloses.length > 1 && Math.abs(slope) > 0.0001) {
                        const lastPrice = recentCloses[recentCloses.length - 1];
                        const firstPrice = recentCloses[0];
                        const avgSlope = (lastPrice - firstPrice) / (recentCloses.length - 1);
                        trendLineValue = lastPrice + avgSlope * 0;
                    }
                    const distToResistance = nearestResistance ? ((nearestResistance - currentPrice) / currentPrice *
                        100) : null;
                    const distToSupport = nearestSupport ? ((currentPrice - nearestSupport) / currentPrice * 100) :
                    null;
                    const distToTrendLine = ((trendLineValue - currentPrice) / currentPrice * 100);
                    let resistanceStatus = 'none';
                    let supportStatus = 'none';
                    let trendStatus = 'none';
                    if (distToResistance !== null) {
                        if (distToResistance < 0.3) resistanceStatus = 'approaching';
                        else if (distToResistance < -0.3) resistanceStatus = 'broken';
                        else if (distToResistance < 1.0) resistanceStatus = 'approaching';
                        else resistanceStatus = 'far';
                    }
                    if (distToSupport !== null) {
                        if (distToSupport < 0.3) supportStatus = 'approaching';
                        else if (distToSupport < -0.3) supportStatus = 'broken';
                        else if (distToSupport < 1.0) supportStatus = 'approaching';
                        else supportStatus = 'far';
                    }
                    if (Math.abs(distToTrendLine) < 0.3) trendStatus = 'approaching';
                    else if (distToTrendLine < -0.3) trendStatus = 'broken';
                    else if (Math.abs(distToTrendLine) < 0.8) trendStatus = 'approaching';
                    else trendStatus = 'far';
                    const isBullish = gmma.trend === 'bullish';
                    const isBearish = gmma.trend === 'bearish';
                    let messages = [];
                    const cache = _srCache[sym];
                    if (cache && cache.levels) {
                        for (let r of cache.levels.resistance) {
                            if (r.broken && r.reversedFrom === null) {
                                messages.push('🔴 Resistance broken → now support (wait for retest)');
                                break;
                            }
                        }
                        for (let s of cache.levels.support) {
                            if (s.broken && s.reversedFrom === null) {
                                messages.push('🟢 Support broken → now resistance (wait for retest)');
                                break;
                            }
                        }
                        for (let r of cache.levels.resistance) {
                            if (r.reversedFrom === 'support') {
                                messages.push('🔄 Support became resistance (role reversal)');
                                break;
                            }
                        }
                        for (let s of cache.levels.support) {
                            if (s.reversedFrom === 'resistance') {
                                messages.push('🔄 Resistance became support (role reversal)');
                                break;
                            }
                        }
                    }
                    if (isBullish && supportStatus === 'approaching') messages.push('🟢 Approaching support – watch for bounce');
                    else if (isBullish && supportStatus === 'broken') messages.push('🔴 Support broken – waiting for retest');
                    else if (isBullish && trendStatus === 'approaching') messages.push('🟡 Approaching trend line – watch for bounce');
                    else if (isBullish && trendStatus === 'broken') messages.push('🔴 Trend line broken – waiting for retest');
                    if (isBearish && resistanceStatus === 'approaching') messages.push('🔴 Approaching resistance – watch for rejection');
                    else if (isBearish && resistanceStatus === 'broken') messages.push('🟢 Resistance broken – waiting for retest');
                    else if (isBearish && trendStatus === 'approaching') messages.push('🟡 Approaching trend line – watch for rejection');
                    else if (isBearish && trendStatus === 'broken') messages.push('🟢 Trend line broken – waiting for retest');
                    if (messages.length === 0) {
                        if (isBullish) messages.push('📈 GMMA bullish, no immediate confluence');
                        else if (isBearish) messages.push('📉 GMMA bearish, no immediate confluence');
                        else messages.push('⏳ GMMA neutral – waiting for trend');
                    }
                    return {
                        resistance: { level: nearestResistance, distance: distToResistance, status: resistanceStatus },
                        support: { level: nearestSupport, distance: distToSupport, status: supportStatus },
                        trendLine: { level: trendLineValue, distance: distToTrendLine, direction: trendDirection,
                            status: trendStatus },
                        gmma: gmma,
                        messages: messages,
                        currentPrice: currentPrice,
                        levels: cache?.levels || { resistance: [], support: [] }
                    };
                }

                function getConfluenceSignal(sym) {
                    const data = marketData[sym];
                    if (!data || !data.priceHistory || data.priceHistory.length < 60) return null;
                    const candle = getCandle(sym);
                    let closes = [];
                    if (candle.history && candle.history.length > 0) closes = candle.history.map(c => c.close);
                    if (candle.close !== null) closes.push(candle.close);
                    if (closes.length < 60) closes = data.priceHistory.slice(-100);
                    const gmma = computeGMMA(closes);
                    if (!gmma) return null;
                    const sr = detectSupportResistance(sym);
                    if (!sr) return null;
                    const currentPrice = data.lastPrice;
                    const nearestResistance = sr.resistance.length > 0 ? sr.resistance[0].level : null;
                    const nearestSupport = sr.support.length > 0 ? sr.support[0].level : null;
                    const recentCloses = closes.slice(-20);
                    const slope = linearRegressionSlope(recentCloses);
                    const trendLineDirection = slope > 0.001 ? 'up' : slope < -0.001 ? 'down' : 'flat';
                    const resistanceDistance = nearestResistance ? ((nearestResistance - currentPrice) / currentPrice *
                        100) : null;
                    const supportDistance = nearestSupport ? ((currentPrice - nearestSupport) / currentPrice * 100) :
                    null;
                    const nearResistance = resistanceDistance !== null && resistanceDistance < 1.0 && resistanceDistance >
                        0;
                    const nearSupport = supportDistance !== null && supportDistance < 1.0 && supportDistance > 0;
                    let signal = { type: 'confluence', side: 'NEUTRAL', reason: '' };
                    if (gmma.trend === 'bullish') {
                        if (nearSupport && trendLineDirection === 'up') {
                            signal.side = 'BUY';
                            signal.reason =
                                `GMMA bullish, price near support (${nearestSupport.toFixed(2)}), trend up`;
                        } else if (nearSupport) {
                            signal.side = 'WATCH';
                            signal.reason =
                                `GMMA bullish, price near support but trend line flat/down – wait for reversal`;
                        } else if (trendLineDirection === 'up') {
                            signal.side = 'WATCH';
                            signal.reason = `GMMA bullish, trend up but not near support – wait for pullback`;
                        } else {
                            signal.side = 'WATCH';
                            signal.reason =
                                `GMMA bullish but no clear confluence – watch for support or trend line bounce`;
                        }
                    } else if (gmma.trend === 'bearish') {
                        if (nearResistance && trendLineDirection === 'down') {
                            signal.side = 'SELL';
                            signal.reason =
                                `GMMA bearish, price near resistance (${nearestResistance.toFixed(2)}), trend down`;
                        } else if (nearResistance) {
                            signal.side = 'WATCH';
                            signal.reason =
                                `GMMA bearish, price near resistance but trend line flat/up – wait for rejection`;
                        } else if (trendLineDirection === 'down') {
                            signal.side = 'WATCH';
                            signal.reason =
                                `GMMA bearish, trend down but not near resistance – wait for rally to resistance`;
                        } else {
                            signal.side = 'WATCH';
                            signal.reason =
                                `GMMA bearish but no clear confluence – watch for resistance or trend line rejection`;
                        }
                    } else {
                        signal.side = 'NEUTRAL';
                        signal.reason = 'GMMA neutral – no clear trend, stay out';
                    }
                    if (Math.abs(gmma.spread) < 0.3 && signal.side !== 'NEUTRAL') {
                        signal.side = 'WATCH';
                        signal.reason += ' (spread too narrow, momentum weak)';
                    }
                    if (gmma.shortGroupContracting || gmma.longGroupContracting) {
                        if (signal.side === 'BUY' || signal.side === 'SELL') {
                            signal.side = 'WATCH';
                            signal.reason += ' (within‑group contraction – momentum fading)';
                        }
                    }
                    return signal;
                }

                // ---- getVanillaSignals ----
                function getVanillaSignals(sym) {
                    let store = candleStore[sym];
                    if (!store || !store.open) store = { history: [], open: null };
                    let candles = store.history.slice();
                    if (store.open !== null && !store.isClosed) candles.push({ ...store });
                    let signals = [];
                    if (candles.length >= 3) {
                        let closes = candles.map(c => c.close);
                        let sma10 = calcSMA(closes, Math.min(10, candles.length));
                        if (sma10) {
                            let rsi = calcRSI(closes, Math.min(14, candles.length));
                            let prevRSI = calcRSI(closes.slice(0, -1), Math.min(14, candles.length - 1));
                            let currentPrice = closes[closes.length - 1];
                            if (currentPrice > sma10 && prevRSI < 50 && rsi >= 50) {
                                signals.push({ type: 'vanilla', side: 'UP', sma10: sma10.toFixed(4), rsi: rsi.toFixed(
                                        1) });
                            }
                            if (currentPrice < sma10 && prevRSI > 50 && rsi <= 50) {
                                signals.push({ type: 'vanilla', side: 'DOWN', sma10: sma10.toFixed(4), rsi: rsi.toFixed(
                                        1) });
                            }
                        }
                    }
                    const conSig = getConfluenceSignal(sym);
                    if (conSig) signals.push({ type: 'confluence', side: conSig.side, reason: conSig.reason });
                    const progress = getConfluenceProgress(sym);
                    if (progress) signals.push({ type: 'confluence_progress', progress: progress });
                    return signals;
                }

                function calcSMA(data, period) {
                    if (data.length < period) return null;
                    return data.slice(-period).reduce((a, b) => a + b, 0) / period;
                }

                function calcRSI(closes, period = 14) {
                    if (closes.length < period + 1) return 50;
                    let gains = 0,
                        losses = 0;
                    for (let i = closes.length - period; i < closes.length; i++) {
                        let diff = closes[i] - closes[i - 1];
                        if (diff > 0) gains += diff;
                        else losses -= diff;
                    }
                    let avgGain = gains / period,
                        avgLoss = losses / period;
                    if (avgLoss === 0) return 100;
                    return 100 - 100 / (1 + avgGain / avgLoss);
                }

                function getHybridStatus(sym) {
                    let data = marketData[sym];
                    if (!data || data.rollingArray.length < 50) return null;
                    let freqData = getDigitPercentages(sym, getSettings().analysisWindow);
                    if (!freqData) return null;
                    let mostDigits = Array.from(freqData.most);
                    let secondDigits = Array.from(freqData.second);
                    if (mostDigits.length === 0 || secondDigits.length === 0) return null;
                    const sets = [
                        { digits: [0, 2, 4], ouSide: 'UNDER', eoSide: 'EVEN', pair: 'UE' },
                        { digits: [4, 6, 8], ouSide: 'OVER', eoSide: 'EVEN', pair: 'OE' },
                        { digits: [5, 7, 9], ouSide: 'OVER', eoSide: 'ODD', pair: 'OO' },
                        { digits: [1, 3, 5], ouSide: 'UNDER', eoSide: 'ODD', pair: 'UO' }
                    ];
                    let target = null;
                    for (let s of sets) {
                        if (mostDigits.every(d => s.digits.includes(d)) && secondDigits.every(d => s.digits.includes(d))) {
                            target = s;
                            break;
                        }
                    }
                    if (!target) return null;
                    let last50 = data.rollingArray.slice(-50);
                    let overCount = last50.filter(d => d >= 5).length,
                        underCount = 50 - overCount;
                    let evenCount = last50.filter(d => d % 2 === 0).length,
                        oddCount = 50 - evenCount;
                    let overPct = (overCount / 50 * 100),
                        evenPct = (evenCount / 50 * 100);
                    let underPct = 100 - overPct,
                        oddPct = 100 - evenPct;
                    let threshold = getSettings().hybridThreshold;
                    let ouValue = target.ouSide === 'OVER' ? overPct : underPct;
                    let eoValue = target.eoSide === 'EVEN' ? evenPct : oddPct;
                    return {
                        pair: target.pair,
                        ouSide: target.ouSide,
                        eoSide: target.eoSide,
                        ouValue,
                        eoValue,
                        ouConfirmed: ouValue >= threshold,
                        eoConfirmed: eoValue >= threshold,
                        bothConfirmed: ouValue >= threshold && eoValue >= threshold,
                        threshold,
                        overCount,
                        underCount,
                        evenCount,
                        oddCount,
                        overPct,
                        underPct,
                        evenPct,
                        oddPct
                    };
                }

                function getPredictSignal(sym) {
                    let data = marketData[sym];
                    if (!data || data.lastDigit === null) return null;
                    let pred = getTopPrediction(sym, data.lastDigit);
                    if (!pred) return null;
                    let s = getSettings();
                    if (pred.percentage >= s.predThreshold) return { type: 'predict', digit: pred.nextDigit,
                        percentage: pred.percentage };
                    return null;
                }

                function getSignal(sym) {
                    if (currentMarket === 'predict') return getPredictSignal(sym);
                    else if (currentMarket === 'overunder') return getOverUnderSignal(sym);
                    else if (currentMarket === 'evenodd') return getEvenOddSignal(sym);
                    else if (currentMarket === 'vanilla') return getVanillaSignals(sym);
                    else if (currentMarket === 'hybrid') return getHybridStatus(sym);
                    return [];
                }

                function applyPointerSettings(ptr, scale) {
                    let style = ptr.style;
                    if (ptr.classList.contains('triangle')) {
                        style.borderLeftWidth = (5 * scale) + 'px';
                        style.borderRightWidth = (5 * scale) + 'px';
                        style.borderBottomWidth = (7 * scale) + 'px';
                    } else if (ptr.classList.contains('arrow')) {
                        style.fontSize = (0.9 * scale) + 'rem';
                    } else if (ptr.classList.contains('dot')) {
                        style.width = (6 * scale) + 'px';
                        style.height = (6 * scale) + 'px';
                    }
                }

                // ---- RENDER CANDLE ----
                function renderCandleDisplay(sym) {
                    const candle = getCandle(sym);
                    const changeEl = document.getElementById(`candleChange_${sym}`);
                    const timerEl = document.getElementById(`candleTimer_${sym}`);
                    const statusEl = document.getElementById(`candleStatus_${sym}`);
                    const rangeEl = document.getElementById(`candleRange_${sym}`);
                    const svgWrapEl = document.getElementById(`candleSvgWrap_${sym}`);
                    if (!candle || candle.open === null || !changeEl) {
                        if (svgWrapEl) svgWrapEl.innerHTML = '';
                        if (statusEl) statusEl.innerText = '⏳ Waiting...';
                        return;
                    }
                    const change = getCandleChange(candle);
                    const isUp = change.direction === 'up';
                    const isDown = change.direction === 'down';
                    const changeStr = change.direction === 'flat' ? '0.00' : (isUp ? '+' : '') + change.change.toFixed(2);
                    const pctStr = change.direction === 'flat' ? '0.00' : (isUp ? '+' : '') + change.pct.toFixed(2) + '%';
                    const dirSymbol = isUp ? '▲' : isDown ? '▼' : '—';
                    changeEl.innerText = `${dirSymbol} ${changeStr} (${pctStr})`;
                    changeEl.className = `candle-change ${change.direction}`;
                    const now = Date.now();
                    const elapsed = (now - candle.minute) / 1000;
                    const remaining = Math.max(0, 60 - elapsed);
                    const remainingSec = Math.floor(remaining);
                    const timerStr = remainingSec + 's';
                    timerEl.innerText = `⏱️ ${timerStr}`;
                    timerEl.className = `candle-timer${remainingSec <= 5 ? ' warning' : ''}`;
                    const open = candle.open;
                    const close = candle.close;
                    const high = candle.high || open;
                    const low = candle.low || open;
                    const range = high - low;
                    let statusText = candle.isClosed ? '🟢 Closed' : `⏳ ${candle.tickCount} ticks · ${timerStr}`;
                    statusEl.innerText = statusText;
                    rangeEl.innerText = `Range: ${range.toFixed(2)}`;
                    let svg = '';
                    const svgWidth = 50;
                    const svgHeight = 100;
                    const centerX = svgWidth / 2;
                    const bodyWidth = 12;
                    const xBody = centerX - bodyWidth / 2;
                    if (range === 0) {
                        svg =
                            `<svg viewBox="0 0 ${svgWidth} ${svgHeight}" preserveAspectRatio="none" style="width:100%;height:100%;">
                                <line x1="10" y1="50" x2="40" y2="50" stroke="var(--text-secondary)" stroke-width="2" stroke-dasharray="2,2" />
                               </svg>`;
                    } else {
                        const color = isUp ? 'var(--candle-up)' : 'var(--candle-down)';
                        let yOpen = ((high - open) / range) * 100;
                        let yClose = ((high - close) / range) * 100;
                        yOpen = Math.min(98, Math.max(2, yOpen));
                        yClose = Math.min(98, Math.max(2, yClose));
                        const yBodyTop = Math.min(yOpen, yClose);
                        const yBodyBottom = Math.max(yOpen, yClose);
                        const bodyHeight = Math.max(1, yBodyBottom - yBodyTop);
                        svg =
                            `<svg viewBox="0 0 ${svgWidth} ${svgHeight}" preserveAspectRatio="none" style="width:100%;height:100%;">
                                <line x1="${centerX}" y1="0" x2="${centerX}" y2="${yBodyTop}" stroke="${color}" stroke-width="2" />
                                <line x1="${centerX}" y1="${yBodyBottom}" x2="${centerX}" y2="${svgHeight}" stroke="${color}" stroke-width="2" />
                                <rect x="${xBody}" y="${yBodyTop}" width="${bodyWidth}" height="${bodyHeight}" fill="${color}" opacity="0.9" />
                                ${bodyHeight <= 1 ? `<line x1="${xBody}" y1="${yBodyTop}" x2="${xBody + bodyWidth}" y2="${yBodyTop}" stroke="${color}" stroke-width="2" />` : ''}
                                <text x="4" y="${Math.min(98, yOpen + 3)}" font-size="7" fill="${color}" font-weight="bold" text-anchor="end">O</text>
                                <text x="${svgWidth - 4}" y="${Math.min(98, yClose + 3)}" font-size="7" fill="${color}" font-weight="bold" text-anchor="start">C</text>
                               </svg>`;
                    }
                    svgWrapEl.innerHTML = svg;
                }

                // ---- PROCESS TICK ----
                function processTick(sym, price, quoteDisplay, epoch) {
                    if (!marketData[sym]) marketData[sym] = { rollingArray: [], last50Array: [], lastDigit: null,
                        lastPriceDisplay: '—',
                        directions: [], lastPrice: null, priceHistory: [] };
                    let d = marketData[sym];
                    d.lastPriceDisplay = quoteDisplay || formatHistoryPrice(sym, price);
                    d.lastDigit = lastDigitFromFormatted(d.lastPriceDisplay);
                    d.rollingArray.push(d.lastDigit);
                    while (d.rollingArray.length > 2000) d.rollingArray.shift();
                    d.last50Array.push(d.lastDigit);
                    if (d.last50Array.length > 50) d.last50Array.shift();
                    if (d.lastPrice !== null) {
                        d.directions.push(price > d.lastPrice ? 1 : price < d.lastPrice ? -1 : 0);
                        while (d.directions.length > 200) d.directions.shift();
                    }
                    d.lastPrice = price;
                    d.priceHistory.push(price);
                    if (d.priceHistory.length > 2000) d.priceHistory.shift();
                    updateCandle(sym, price);
                    closeCandleIfNeeded(sym);
                    if (d.priceHistory.length % 10 === 0) detectSupportResistance(sym);
                    // Alarm now only fires if there's a valid signal (checked inside checkAlarm)
                    checkAlarm(sym, price);
                    renderMarket(sym);
                    // Update suggestions on every tick
                    updateSuggestions();
                }

                // ---- RENDER MARKET ----
                function renderMarket(sym) {
                    let data = marketData[sym];
                    if (!data || !data.rollingArray.length) return;
                    let last100 = data.rollingArray.slice(-100);
                    let last50 = data.rollingArray.slice(-50);
                    let s = getSettings();
                    const card = document.getElementById(`market_${sym}`);
                    if (!card) return;

                    document.getElementById(`livePriceBig_${sym}`).innerText = data.lastPriceDisplay;
                    document.getElementById(`lastDigit_${sym}`).innerText = data.lastDigit;

                    renderCandleDisplay(sym);

                    let stab = getDigitStability(sym);
                    let stabDiv = document.getElementById(`stability_${sym}`);
                    if (stabDiv && stab) {
                        stabDiv.innerHTML = `<span class="${stab.cssClass}">⚖️ ${stab.label} (avg Δ ${stab.avgDiff.toFixed(2)})</span>`;
                    } else if (stabDiv) {
                        stabDiv.innerHTML = '⚖️ --';
                    }

                    let cond = getMarketCondition(sym);
                    let condDiv = document.getElementById(`condition_${sym}`);
                    if (condDiv && cond) {
                        condDiv.innerHTML = `<span class="${cond.cssClass}">📈 ${cond.label}</span>`;
                    } else if (condDiv) {
                        condDiv.innerHTML = '📈 --';
                    }

                    let zoneMem = document.getElementById(`zoneMemory_${sym}`);
                    if (zoneMem) {
                        const stats = computeZoneMemory(data.rollingArray, s.zoneWindow);
                        if (stats) {
                            const { pct, currentZone, streak, stats3, stats6 } = stats;

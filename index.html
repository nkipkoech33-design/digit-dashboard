                                statusClass = first.side === 'BUY' || first.side === 'UP' ? 'buy' : 'sell';
                            } else {
                                const gmmaSig = signal.find(s => s.type === 'confluence_progress');
                                if (gmmaSig && gmmaSig.progress) {
                                    const trend = gmmaSig.progress.gmma.trend;
                                    const label = trend.charAt(0).toUpperCase() + trend.slice(1);
                                    statusText = label;
                                    statusClass = trend;
                                }
                            }
                        } else if (signal && !Array.isArray(signal)) {
                            if (signal.type === 'predict' || signal.type === 'evenodd') {
                                hasActiveSignal = true;
                                suffix = signal.type === 'predict' ? ` → ${signal.digit} (${signal.percentage.toFixed(1)}%)` :
                                    ` → ${signal.side}`;
                                statusText = signal.type === 'predict' ? `${signal.digit}` : signal.side;
                                statusClass = signal.type === 'predict' ? 'buy' : (signal.side === 'EVEN' ?
                                    'buy' : 'sell');
                            }
                        }

                        // Apply highlight only if signal is currently active
                        let style = hasActiveSignal ? `background-color: ${s.highlightColor}; color: white;` : '';
                        let statusSpan = statusText ?
                            `<span class="ml-status ${statusClass}">${statusText}</span>` :
                            '';

                        return `<div class="market-list-item" data-symbol="${sym}" style="${style}">
                                    <span>${MARKET_NAMES[sym]}</span>
                                    ${statusSpan}
                                </div>`;
                    }).join('');
                    document.getElementById('marketsListContainer').innerHTML = items;
                    document.querySelectorAll('.market-list-item').forEach(el => { el.onclick = () => setFocus(el
                            .dataset.symbol); });
                }

                // ===== SUGGESTIONS ENGINE – EXCLUDE PREDICT =====
                function getTradeSuggestions() {
                    // Only consider Over/Under, Even/Odd, and Vanilla
                    const marketTypes = ['overunder', 'evenodd', 'vanilla'];
                    const suggestions = [];

                    for (const mt of marketTypes) {
                        // Temporarily switch market to check signals
                        const prevMarket = currentMarket;
                        currentMarket = mt;

                        for (const sym of ALL_SYMBOLS) {
                            const data = marketData[sym];
                            if (!data || !data.rollingArray || data.rollingArray.length < 50) continue;

                            let sig = getSignal(sym);
                            let isReady = false;
                            let label = '';
                            let strength = 0;

                            if (mt === 'overunder') {
                                if (sig && sig.side) {
                                    isReady = true;
                                    label = `→ ${sig.side}`;
                                    strength = 100 - (sig.side === 'OVER' ? (sig.sum01 + sig.sum23) / 2 : (sig.sum67 +
                                        sig.sum89) / 2);
                                }
                            } else if (mt === 'evenodd') {
                                if (sig && sig.side) {
                                    isReady = true;
                                    label = `→ ${sig.side}`;
                                    strength = 80;
                                }
                            } else if (mt === 'vanilla') {
                                if (Array.isArray(sig)) {
                                    const active = sig.filter(s => (s.type === 'confluence' && (s.side === 'BUY' || s
                                        .side === 'SELL')) ||
                                        (s.type === 'vanilla' && (s.side === 'UP' || s.side === 'DOWN')));
                                    if (active.length > 0) {
                                        isReady = true;
                                        label = `→ ${active[0].side}`;
                                        strength = active[0].type === 'confluence' ? 85 : 70;
                                    }
                                }
                            }

                            if (isReady) {
                                suggestions.push({
                                    symbol: sym,
                                    market: mt,
                                    label: label,
                                    strength: strength,
                                    displayName: MARKET_NAMES[sym] || sym,
                                    side: label
                                });
                            }
                        }

                        // Restore current market
                        currentMarket = prevMarket;
                    }

                    // Sort by strength descending, take top 8
                    suggestions.sort((a, b) => b.strength - a.strength);
                    return suggestions.slice(0, 8);
                }

                function updateSuggestions() {
                    const grid = document.getElementById('suggestionGrid');
                    const countBadge = document.getElementById('suggestionCount');
                    if (!grid) return;

                    try {
                        const suggestions = getTradeSuggestions();
                        const readyCount = suggestions.length;

                        countBadge.textContent = `${readyCount} ready`;

                        if (readyCount === 0) {
                            grid.innerHTML =
                                `<span style="font-size:0.6rem;color:var(--text-secondary);">⏳ No active signals (Over/Under, Even/Odd, Vanilla)</span>`;
                            return;
                        }

                        let html = '';
                        for (const sug of suggestions) {
                            const marketIcon = {
                                'overunder': '📊',
                                'evenodd': '🎲',
                                'vanilla': '📈'
                            } [sug.market] || '📊';

                            const chipClass = sug.strength > 75 ? 'ready' : (sug.strength > 50 ? 'watch' : 'idle');
                            // Use data attributes and event delegation instead of inline onclick
                            html += `
                                    <div class="suggestion-chip ${chipClass}" data-market="${sug.market}" data-symbol="${sug.symbol}" title="${sug.displayName} · ${sug.market}">
                                        <span class="chip-sym">${marketIcon} ${sug.displayName}</span>
                                        <span class="chip-signal">${sug.label}</span>
                                    </div>
                                `;
                        }

                        grid.innerHTML = html;
                        // Attach click listeners via delegation on the grid
                        grid.querySelectorAll('.suggestion-chip').forEach(chip => {
                            chip.addEventListener('click', function(e) {
                                const market = this.dataset.market;
                                const symbol = this.dataset.symbol;
                                if (market && symbol) {
                                    window.setMarket(market);
                                    window.setFocus(symbol);
                                }
                            });
                        });
                    } catch (e) {
                        // Silently fail – suggestions are non-critical
                    }
                }

                let timerRefresh;
                let suggestionInterval;

                function startTimerRefresh() {
                    if (timerRefresh) clearInterval(timerRefresh);
                    timerRefresh = setInterval(updateAllMarketsList, 1000);
                    if (suggestionInterval) clearInterval(suggestionInterval);
                    suggestionInterval = setInterval(updateSuggestions, 1000);
                }

                function createMarketUI(sym, name) {
                    if (document.getElementById(`market_${sym}`)) return;
                    let card = document.createElement('div');
                    card.className = 'market-card';
                    card.id = `market_${sym}`;
                    card.innerHTML = `
                            <div class="market-header">
                                <div class="market-title"><span>📈 ${name}</span><span class="focus-icon" onclick="window.setFocus('${sym}')">👁️</span></div>
                                <div><span class="live-price-big" id="livePriceBig_${sym}">—</span></div>
                                <div class="market-status" id="status_${sym}">🔴 no data</div>
                                <span class="last-digit-badge" id="lastDigit_${sym}">?</span>
                            </div>
                            <div class="card-content">
                                <div class="card-main-info">
                                    <div id="digitsContainer_${sym}" class="digits-grid"></div>
                                    <div class="info-row">
                                        <div class="stat-box" id="stability_${sym}">⚖️ --</div>
                                        <div class="stat-box" id="condition_${sym}">📈 --</div>
                                    </div>
                                    <div id="zoneMemory_${sym}" class="zone-memory">⏳</div>
                                    <div id="zoneBarContainer_${sym}" class="zone-bar-container"></div>
                                    <div id="eoTwo_${sym}" class="eo-two-container" style="display:none;"></div>
                                    <div id="pairBias_${sym}" class="pair-bias-container" style="display:none;"></div>
                                    <div id="groupBias_${sym}" class="group-bias-container"></div>
                                    <div id="tugWar_${sym}"></div>
                                    <div id="transitions_${sym}"></div>
                                    <div class="letter-sequence-wrapper">
                                        <div class="letter-sequence" id="letterSeq1_${sym}"></div>
                                        <div class="letter-sequence digit-sequence" id="digitSeq1_${sym}"></div>
                                        <div class="letter-sequence" id="letterSeq2_${sym}"></div>
                                        <div class="letter-sequence digit-sequence" id="digitSeq2_${sym}"></div>
                                    </div>
                                    <div class="signal-area" id="signalDisplay_${sym}">⏳</div>
                                    <div id="trendBars_${sym}" class="trend-bars"></div>
                                </div>
                                <div class="candle-display" id="candleDisplay_${sym}">
                                    <div class="candle-header">
                                        <span class="candle-label">📊 1m</span>
                                        <span class="candle-change" id="candleChange_${sym}">--</span>
                                        <span class="candle-timer" id="candleTimer_${sym}">⏱️ --</span>
                                    </div>
                                    <div class="candle-svg-wrap" id="candleSvgWrap_${sym}"></div>
                                    <div class="candle-footer">
                                        <span class="candle-ticks" id="candleStatus_${sym}">⏳</span>
                                        <span class="candle-range" id="candleRange_${sym}">Range: --</span>
                                    </div>
                                </div>
                            </div>`;
                    document.getElementById('marketsContainer').appendChild(card);
                }

                function subscribeToMarket(sym) {
                    if (ws && ws.readyState === WebSocket.OPEN && !invalidSymbols.has(sym)) {
                        ws.send(JSON.stringify({ ticks_history: sym, count: 1500, end: "latest", style: "ticks" }));
                        ws.send(JSON.stringify({ ticks: sym, subscribe: 1 }));
                    }
                }

                function connectWebSocket() {
                    if (ws) {
                        try { ws.close(); } catch (e) {}
                        ws = null;
                    }
                    document.getElementById('connectionStatus').innerHTML = '⏳ Connecting...';
                    ws = new WebSocket('wss://api.derivws.com/trading/v1/options/ws/public');
                    ws.onopen = () => {
                        document.getElementById('connectionStatus').innerHTML = '✅ Connected (public feed)';
                        for (let sym of ALL_SYMBOLS) {
                            if (!invalidSymbols.has(sym)) {
                                subscribeToMarket(sym);
                            }
                        }
                        startCandleTimer();
                    };
                    ws.onmessage = e => {
                        try {
                            let msg = JSON.parse(e.data);
                            if (msg.error && msg.error.code === 'InvalidSymbol' && msg.echo_req?.ticks_history) {
                                let sym = msg.echo_req.ticks_history;
                                if (MARKET_NAMES[sym]) invalidSymbols.add(sym);
                            } else if (msg.msg_type === 'tick' && msg.tick) {
                                let sym = msg.tick.symbol;
                                if (MARKET_NAMES[sym] && !invalidSymbols.has(sym)) {
                                    processTick(sym, msg.tick.quote, msg.tick.quote_display, msg.tick.epoch);
                                    document.getElementById(`status_${sym}`).innerHTML = '🟢 live';
                                }
                            } else if (msg.msg_type === 'history' && msg.history?.prices && msg.echo_req
                                ?.ticks_history) {
                                let sym = msg.echo_req.ticks_history;
                                if (MARKET_NAMES[sym] && !invalidSymbols.has(sym)) {
                                    msg.history.prices.forEach((p, i) => processTick(sym, p, null, Date.now() - (
                                        msg.history.prices.length - i) * 1000));
                                }
                            }
                        } catch (err) {}
                    };
                    ws.onerror = () => { document.getElementById('connectionStatus').innerHTML = '⚠️ Error'; };
                    ws.onclose = () => { document.getElementById('connectionStatus').innerHTML = '🔴 Disconnected'; };
                }

                function toggleMode() { document.body.classList.toggle('light'); }

                // Expose functions globally for inline onclick and suggestion clicks
                window.setMarket = function(m) {
                    currentMarket = m;
                    setFocus(null);
                    document.querySelectorAll('.market-btn').forEach(b => b.classList.toggle('active', b.dataset.market ===
                    m));
                    document.getElementById('strategySelector').style.display = (m === 'evenodd' || m === 'hybrid') ?
                        'flex' : 'none';
                    for (let s in marketData) if (marketData[s]?.rollingArray?.length) renderMarket(s);
                    updateAllMarketsList();
                    updateSuggestions();
                };

                window.setFocus = function(sym) {
                    focusedSymbol = sym;
                    document.getElementById('focusBar').style.display = sym ? 'flex' : 'none';
                    applyFocusVisibility();
                    // Scroll the focused card into view if needed
                    if (sym) {
                        const card = document.getElementById(`market_${sym}`);
                        if (card) {
                            card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
                        }
                    }
                };

                // Override setFocus and setMarket inside the closure to use the global ones
                // Actually we already have them defined inside, but we need to ensure the inline onclick uses the global ones.
                // The inline onclick in the HTML uses setFocus and setMarket, which will now be global.
                // Also the suggestion chips use data attributes and event listeners attached above.

                function setStrategy(str) {
                    currentStrategy = str;
                    document.querySelectorAll('.strategy-btn').forEach(b => b.classList.toggle('active', b.dataset
                        .strategy === str));
                    for (let s in marketData) if (marketData[s]?.rollingArray?.length) renderMarket(s);
                    updateAllMarketsList();
                    updateSuggestions();
                }

                let candleTimerInterval;

                function startCandleTimer() {
                    if (candleTimerInterval) clearInterval(candleTimerInterval);
                    candleTimerInterval = setInterval(() => {
                        const now = Date.now();
                        for (const sym of ALL_SYMBOLS) {
                            if (!marketData[sym] || !marketData[sym].rollingArray || marketData[sym].rollingArray
                                .length === 0) continue;
                            closeCandleIfNeeded(sym);
                            renderCandleDisplay(sym);
                            if (Math.random() < 0.1) detectSupportResistance(sym);
                        }
                    }, 1000);
                }

                // ---- INIT ----
                createAllCards();
                document.querySelectorAll('.market-btn').forEach(b => b.onclick = () => window.setMarket(b.dataset.market));
                document.querySelectorAll('.strategy-btn').forEach(b => b.onclick = () => setStrategy(b.dataset.strategy));
                document.getElementById('showAllBtn')?.addEventListener('click', () => window.setFocus(null));
                document.getElementById('settingsBtn').onclick = () => document.getElementById('settingsModal').style
                    .display = 'flex';
                document.getElementById('closeModal').onclick = () => document.getElementById('settingsModal').style
                    .display = 'none';
                window.onclick = e => { if (e.target === document.getElementById('settingsModal')) document.getElementById(
                        'settingsModal').style.display = 'none'; };

                // Settings listeners for OU threshold
                document.getElementById('ouThreshold')?.addEventListener('change', () => {
                    for (let s in marketData) if (marketData[s]?.rollingArray?.length) renderMarket(s);
                    updateAllMarketsList();
                    updateSuggestions();
                });

                setTimeout(connectWebSocket, 800);
                window.setMarket('predict');
                startTimerRefresh();

                console.log('✅ TAJIRI TRADERS – Suggestions now only for Over/Under, Even/Odd, Vanilla (Predict excluded).');
            } catch (err) {
                console.error('Error initializing app:', err);
                document.body.innerHTML =
                    `<div style="color:red;padding:20px;font-size:16px;">Error loading UI. Please refresh. Details: ${err.message}</div>`;
            }
        })();
    </script>
</body>
</html>

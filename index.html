                                    <div class="signal-flash" style="color:${status.ouConfirmed?'#4ade80':'#facc15'};">${ouLabel}: ${status.ouValue.toFixed(0)}% ${status.ouConfirmed?'✅':'⏳'}</div>
                                    <div class="signal-flash" style="color:${status.eoConfirmed?'#4ade80':'#facc15'};">${eoLabel}: ${status.eoValue.toFixed(0)}% ${status.eoConfirmed?'✅':'⏳'}</div>`;
                        }
                    } else {
                        sigDiv.innerHTML = `<div class="signal-flash">⏳ No direction identified</div>`;
                    }
                }

                // Digit grid
                let freqData = getDigitPercentages(sym, s.analysisWindow);
                if (freqData) {
                    let grid = document.getElementById(`digitsContainer_${sym}`);
                    if (grid) {
                        grid.innerHTML = '';
                        let evens = [0, 2, 4, 6, 8],
                            odds = [1, 3, 5, 7, 9];
                        let row1 = document.createElement('div');
                        row1.className = 'digits-row';
                        evens.forEach(d => {
                            let cell = document.createElement('div');
                            cell.className = 'digit-cell';
                            if (freqData.most.has(d)) cell.classList.add('most');
                            if (freqData.second.has(d)) cell.classList.add('second');
                            if (freqData.least.has(d)) cell.classList.add('least');
                            if (freqData.secondLeast.has(d)) cell.classList.add('secondleast');
                            cell.innerHTML =
                                `<span class="digit">${d}</span><div class="percent">${freqData.pct[d].toFixed(1)}%</div>`;
                            if (data.lastDigit === d) {
                                cell.classList.add('last-digit-highlight');
                                let ptr = document.createElement('div');
                                ptr.className = `pointer-marker ${s.pointerStyle}`;
                                if (s.pointerStyle === 'arrow') ptr.innerHTML = '›';
                                applyPointerSettings(ptr, s.pointerScale);
                                cell.appendChild(ptr);
                            }
                            row1.appendChild(cell);
                        });
                        let row2 = document.createElement('div');
                        row2.className = 'digits-row';
                        odds.forEach(d => {
                            let cell = document.createElement('div');
                            cell.className = 'digit-cell';
                            if (freqData.most.has(d)) cell.classList.add('most');
                            if (freqData.second.has(d)) cell.classList.add('second');
                            if (freqData.least.has(d)) cell.classList.add('least');
                            if (freqData.secondLeast.has(d)) cell.classList.add('secondleast');
                            cell.innerHTML =
                                `<span class="digit">${d}</span><div class="percent">${freqData.pct[d].toFixed(1)}%</div>`;
                            if (data.lastDigit === d) {
                                cell.classList.add('last-digit-highlight');
                                let ptr = document.createElement('div');
                                ptr.className = `pointer-marker ${s.pointerStyle}`;
                                if (s.pointerStyle === 'arrow') ptr.innerHTML = '›';
                                applyPointerSettings(ptr, s.pointerScale);
                                cell.appendChild(ptr);
                            }
                            row2.appendChild(cell);
                        });
                        grid.appendChild(row1);
                        grid.appendChild(row2);
                    }
                }

                // Hide other elements
                let eoDiv = document.getElementById(`eoTwo_${sym}`);
                if (eoDiv) eoDiv.style.display = 'none';
                let pairDiv = document.getElementById(`pairBias_${sym}`);
                if (pairDiv) pairDiv.style.display = 'none';
                let transDiv = document.getElementById(`transitions_${sym}`);
                if (transDiv) transDiv.style.display = 'none';
                let trendDiv = document.getElementById(`trendBars_${sym}`);
                if (trendDiv) trendDiv.style.display = 'none';

                document.getElementById(`status_${sym}`).innerHTML = '🟢 live';
                return;
            }

            // ---- PREDICT MODE ----
            if (currentMarket === 'predict') {
                // Hide zone bar
                const zoneBarContainer = document.getElementById(`zoneBarContainer_${sym}`);
                if (zoneBarContainer) { zoneBarContainer.style.display = 'none';
                    zoneBarContainer.innerHTML = ''; }

                let pred = getTopPrediction(sym, data.lastDigit);
                let signal = getPredictSignal(sym);
                let sigDiv = document.getElementById(`signalDisplay_${sym}`);
                if (sigDiv) {
                    if (signal) {
                        sigDiv.innerHTML =
                            `<div class="signal-flash" style="color:#4ade80;">🎯 NEXT: ${signal.digit} (${signal.percentage.toFixed(1)}%)</div>`;
                    } else {
                        sigDiv.innerHTML = `<div class="signal-flash">⏳ Below ${getSettings().predThreshold}%</div>`;
                    }
                }

                // Digit grid
                let freqData = getDigitPercentages(sym, s.analysisWindow);
                if (freqData) {
                    let grid = document.getElementById(`digitsContainer_${sym}`);
                    if (grid) {
                        grid.innerHTML = '';
                        let evens = [0, 2, 4, 6, 8],
                            odds = [1, 3, 5, 7, 9];
                        let row1 = document.createElement('div');
                        row1.className = 'digits-row';
                        evens.forEach(d => {
                            let cell = document.createElement('div');
                            cell.className = 'digit-cell';
                            if (freqData.most.has(d)) cell.classList.add('most');
                            if (freqData.second.has(d)) cell.classList.add('second');
                            if (freqData.least.has(d)) cell.classList.add('least');
                            if (freqData.secondLeast.has(d)) cell.classList.add('secondleast');
                            cell.innerHTML =
                                `<span class="digit">${d}</span><div class="percent">${freqData.pct[d].toFixed(1)}%</div>`;
                            if (data.lastDigit === d) {
                                cell.classList.add('last-digit-highlight');
                                let ptr = document.createElement('div');
                                ptr.className = `pointer-marker ${s.pointerStyle}`;
                                if (s.pointerStyle === 'arrow') ptr.innerHTML = '›';
                                applyPointerSettings(ptr, s.pointerScale);
                                cell.appendChild(ptr);
                            }
                            row1.appendChild(cell);
                        });
                        let row2 = document.createElement('div');
                        row2.className = 'digits-row';
                        odds.forEach(d => {
                            let cell = document.createElement('div');
                            cell.className = 'digit-cell';
                            if (freqData.most.has(d)) cell.classList.add('most');
                            if (freqData.second.has(d)) cell.classList.add('second');
                            if (freqData.least.has(d)) cell.classList.add('least');
                            if (freqData.secondLeast.has(d)) cell.classList.add('secondleast');
                            cell.innerHTML =
                                `<span class="digit">${d}</span><div class="percent">${freqData.pct[d].toFixed(1)}%</div>`;
                            if (data.lastDigit === d) {
                                cell.classList.add('last-digit-highlight');
                                let ptr = document.createElement('div');
                                ptr.className = `pointer-marker ${s.pointerStyle}`;
                                if (s.pointerStyle === 'arrow') ptr.innerHTML = '›';
                                applyPointerSettings(ptr, s.pointerScale);
                                cell.appendChild(ptr);
                            }
                            row2.appendChild(cell);
                        });
                        grid.appendChild(row1);
                        grid.appendChild(row2);
                    }
                }

                // ---- LETTERS + DIGITS (50-tick numbers) - FIXED ----
                let seq1 = document.getElementById(`letterSeq1_${sym}`);
                let seq2 = document.getElementById(`letterSeq2_${sym}`);
                let dig1 = document.getElementById(`digitSeq1_${sym}`);
                let dig2 = document.getElementById(`digitSeq2_${sym}`);
                if (seq1 && seq2 && dig1 && dig2 && data.rollingArray.length >= 50) {
                    const len = Math.min(data.rollingArray.length, 100);
                    const start = data.rollingArray.length - len;
                    const slice = data.rollingArray.slice(start);
                    const older = slice.slice(0, 50);
                    const newer = slice.slice(50);
                    const mapDigit = d => d <= 3 ? 'U' : d <= 5 ? 'M' : 'O';
                    const buildRow = (arr) => arr.map(d =>
                        `<span class="seq-${mapDigit(d).toLowerCase()}">${mapDigit(d)}</span>`).join('');
                    const buildDigits = (arr) => arr.map(d =>
                        `<span class="digit-num">${d}</span>`).join('');
                    seq1.innerHTML = older.length ? buildRow(older) : '';
                    dig1.innerHTML = older.length ? buildDigits(older) : '';
                    seq2.innerHTML = newer.length ? buildRow(newer) : '';
                    dig2.innerHTML = newer.length ? buildDigits(newer) : '';
                    const wrapper = document.querySelector(`#market_${sym} .letter-sequence-wrapper`);
                    if (wrapper) wrapper.style.display = 'block';
                } else {
                    const wrapper = document.querySelector(`#market_${sym} .letter-sequence-wrapper`);
                    if (wrapper) wrapper.style.display = 'block';
                    if (seq1) seq1.innerHTML = '⏳';
                    if (dig1) dig1.innerHTML = '';
                    if (seq2) seq2.innerHTML = '⏳';
                    if (dig2) dig2.innerHTML = '';
                }

                // Trend bars (Predict only)
                let trendDiv = document.getElementById(`trendBars_${sym}`);
                if (trendDiv) {
                    let even = last50.filter(d => d % 2 === 0).length;
                    let overPct = even / 50 * 100,
                        underPct = 100 - overPct;
                    trendDiv.style.display = 'flex';
                    trendDiv.innerHTML = `
                            <div class="trend-bar-item"><div class="trend-bar-label">Even</div><div class="trend-bar-container"><div class="trend-bar-fill even" style="width:${overPct}%"></div></div><div class="trend-percent">${overPct.toFixed(1)}%</div></div>
                            <div class="trend-bar-item"><div class="trend-bar-label">Odd</div><div class="trend-bar-container"><div class="trend-bar-fill odd" style="width:${underPct}%"></div></div><div class="trend-percent">${underPct.toFixed(1)}%</div></div>`;
                }

                // Hide other elements
                let eoDiv = document.getElementById(`eoTwo_${sym}`);
                if (eoDiv) eoDiv.style.display = 'none';
                let pairDiv = document.getElementById(`pairBias_${sym}`);
                if (pairDiv) pairDiv.style.display = 'none';
                let groupDiv = document.getElementById(`groupBias_${sym}`);
                if (groupDiv) groupDiv.style.display = 'none';
                let tugWarDiv = document.getElementById(`tugWar_${sym}`);
                if (tugWarDiv) tugWarDiv.style.display = 'none';
                let transDiv = document.getElementById(`transitions_${sym}`);
                if (transDiv) transDiv.style.display = 'none';

                document.getElementById(`status_${sym}`).innerHTML = '🟢 live';
                return;
            }

            // Fallback
            document.getElementById(`status_${sym}`).innerHTML = '🟢 live';
        }

        // ---- UI MECHANICS ----
        function setFocus(sym) { focusedSymbol = sym;
            document.getElementById('focusBar').style.display = sym ? 'flex' : 'none';
            applyFocusVisibility(); }

        function applyFocusVisibility() { let cards = document.querySelectorAll('.market-card'); if (focusedSymbol) { cards
                .forEach(c => c.style.display = c.id === `market_${focusedSymbol}` ? 'flex' : 'none'); } else cards.forEach(
                c => c.style.display = 'flex'); }

        function showAllMarkets() { setFocus(null); }

        function updateAllMarketsList() {
            let s = getSettings();
            let items = ALL_SYMBOLS.map(sym => {
                let signal = getSignal(sym);
                let suffix = '';
                if (currentMarket === 'hybrid') {
                    if (signal) {
                        if (signal.bothConfirmed) {
                            suffix =
                                ` → ${signal.ouSide}/${signal.eoSide} (${signal.ouValue.toFixed(0)}%/${signal.eoValue.toFixed(0)}%)`;
                        } else {
                            suffix =
                                ` → ${signal.ouSide}:${signal.ouValue.toFixed(0)}% ${signal.eoSide}:${signal.eoValue.toFixed(0)}%`;
                        }
                    }
                } else if (Array.isArray(signal) && signal.length > 0) {
                    if (signal[0].type === 'vanilla') {
                        suffix = ` → ${signal[0].side}`;
                    } else {
                        suffix = ` → ${signal.length} signal(s)`;
                    }
                } else if (signal && !Array.isArray(signal)) {
                    if (signal.type === 'predict') suffix = ` → ${signal.digit} (${signal.percentage.toFixed(1)}%)`;
                    else if (signal.type === 'overunder') suffix = ` → ${signal.side}`;
                    else if (signal.type === 'evenodd') suffix = ` → ${signal.side}`;
                }
                let hasSignal = (signal && (Array.isArray(signal) ? signal.length > 0 : true));
                let style = hasSignal ? `background-color: ${s.highlightColor}; color: white;` : '';
                return `<div class="market-list-item" data-symbol="${sym}" style="${style}"><span>${MARKET_NAMES[sym]}${suffix}</span></div>`;
            }).join('');
            document.getElementById('marketsListContainer').innerHTML = items;
            document.querySelectorAll('.market-list-item').forEach(el => { el.onclick = () => setFocus(el.dataset.symbol); });
        }
        let timerRefresh;

        function startTimerRefresh() { if (timerRefresh) clearInterval(timerRefresh);
            timerRefresh = setInterval(updateAllMarketsList, 1000); }

        function createMarketUI(sym, name) {
            if (document.getElementById(`market_${sym}`)) return;
            let card = document.createElement('div');
            card.className = 'market-card';
            card.id = `market_${sym}`;
            card.innerHTML = `
                    <div class="market-header">
                        <div class="market-title"><span>📈 ${name}</span><span class="focus-icon" onclick="setFocus('${sym}')">👁️</span></div>
                        <div><span class="live-price-big" id="livePriceBig_${sym}">—</span></div>
                        <div class="market-status" id="status_${sym}">🔴 no data</div>
                        <span class="last-digit-badge" id="lastDigit_${sym}">?</span>
                    </div>
                    <div class="card-content">
                        <div id="digitsContainer_${sym}" class="digits-grid"></div>
                        <div class="info-row">
                            <div class="stat-box" id="stability_${sym}">⚖️ --</div>
                            <div class="stat-box" id="condition_${sym}">📈 --</div>
                        </div>
                        <div id="zoneMemory_${sym}" class="zone-memory">⏳</div>
                        <div id="zoneBarContainer_${sym}" class="zone-bar-container"></div>
                        <div id="eoTwo_${sym}" class="eo-two-container" style="display:none;"></div>
                        <div id="pairBias_${sym}" class="pair-bias-container" style="display:none;"></div>
                        <div id="groupBias_${sym}" class="group-bias-container"></div>
                        <div id="tugWar_${sym}"></div>
                        <div id="transitions_${sym}"></div>
                        <div class="letter-sequence-wrapper">
                            <div class="letter-sequence" id="letterSeq1_${sym}"></div>
                            <div class="letter-sequence digit-sequence" id="digitSeq1_${sym}"></div>
                            <div class="letter-sequence" id="letterSeq2_${sym}"></div>
                            <div class="letter-sequence digit-sequence" id="digitSeq2_${sym}"></div>
                        </div>
                        <div class="signal-area" id="signalDisplay_${sym}">⏳</div>
                        <div id="trendBars_${sym}" class="trend-bars"></div>
                    </div>`;
            document.getElementById('marketsContainer').appendChild(card);
        }

        function subscribeToMarket(sym) {
            if (ws && ws.readyState === WebSocket.OPEN && !invalidSymbols.has(sym)) {
                ws.send(JSON.stringify({ ticks_history: sym, count: 1000, end: "latest", style: "ticks" }));
                ws.send(JSON.stringify({ ticks: sym, subscribe: 1 }));
            }
        }

        function connectWebSocket() {
            if (ws) ws.close();
            document.getElementById('connectionStatus').innerHTML = '⏳ Connecting...';
            ws = new WebSocket('wss://api.derivws.com/trading/v1/options/ws/public');
            ws.onopen = () => {
                document.getElementById('connectionStatus').innerHTML = '✅ Connected (public feed)';
                document.getElementById('marketsContainer').innerHTML = '';
                marketData = {};
                invalidSymbols.clear();
                _srCache = {};
                _lastAlarmTime = {};
                ALL_SYMBOLS.forEach(s => createMarketUI(s, MARKET_NAMES[s]));
                let idx = 0;
                let nextSub = () => {
                    if (idx >= ALL_SYMBOLS.length) { document.getElementById('connectionStatus').innerHTML =
                            `✅ ${currentMarket.toUpperCase()}`; return; }
                    subscribeToMarket(ALL_SYMBOLS[idx]);
                    idx++;
                    setTimeout(nextSub, 200);
                };
                nextSub();
                startTimerRefresh();
            };
            ws.onmessage = e => {
                try {
                    let msg = JSON.parse(e.data);
                    if (msg.error && msg.error.code === 'InvalidSymbol' && msg.echo_req?.ticks_history) {
                        let sym = msg.echo_req.ticks_history;
                        if (MARKET_NAMES[sym]) invalidSymbols.add(sym);
                    } else if (msg.msg_type === 'tick' && msg.tick) {
                        let sym = msg.tick.symbol;
                        if (MARKET_NAMES[sym] && !invalidSymbols.has(sym)) {
                            processTick(sym, msg.tick.quote, msg.tick.quote_display, msg.tick.epoch);
                            document.getElementById(`status_${sym}`).innerHTML = '🟢 live';
                        }
                    } else if (msg.msg_type === 'history' && msg.history?.prices && msg.echo_req?.ticks_history) {
                        let sym = msg.echo_req.ticks_history;
                        if (MARKET_NAMES[sym] && !invalidSymbols.has(sym)) {
                            msg.history.prices.forEach((p, i) => processTick(sym, p, null, Date.now() - (msg.history
                                .prices.length - i) * 1000));
                        }
                    }
                } catch (err) {}
            };
            ws.onerror = () => { document.getElementById('connectionStatus').innerHTML = '⚠️ Error'; };
            ws.onclose = () => { document.getElementById('connectionStatus').innerHTML = '🔴 Disconnected'; };
        }

        function toggleMode() { document.body.classList.toggle('light'); }

        function setMarket(m) {
            currentMarket = m;
            setFocus(null);
            document.querySelectorAll('.market-btn').forEach(b => b.classList.toggle('active', b.dataset.market === m));
            document.getElementById('strategySelector').style.display = (m === 'evenodd' || m === 'hybrid') ? 'flex' : 'none';
            for (let s in marketData)
                if (marketData[s]?.rollingArray?.length) renderMarket(s);
            updateAllMarketsList();
        }

        function setStrategy(str) {
            currentStrategy = str;
            document.querySelectorAll('.strategy-btn').forEach(b => b.classList.toggle('active', b.dataset.strategy === str));
            for (let s in marketData)
                if (marketData[s]?.rollingArray?.length) renderMarket(s);
            updateAllMarketsList();
        }

        // ---- INIT ----
        document.querySelectorAll('.market-btn').forEach(b => b.onclick = () => setMarket(b.dataset.market));
        document.querySelectorAll('.strategy-btn').forEach(b => b.onclick = () => setStrategy(b.dataset.strategy));
        document.getElementById('showAllBtn')?.addEventListener('click', showAllMarkets);
        document.getElementById('settingsBtn').onclick = () => document.getElementById('settingsModal').style.display = 'flex';
        document.getElementById('closeModal').onclick = () => document.getElementById('settingsModal').style.display = 'none';
        window.onclick = e => { if (e.target === document.getElementById('settingsModal')) document.getElementById(
                'settingsModal').style.display = 'none'; };

        // Auto-connect on page load
        setTimeout(connectWebSocket, 500);

        setMarket('predict');

        console.log('✅ TAJIRI TRADERS – Auto-connect enabled, UI layout restored.');
    </script>
</body>

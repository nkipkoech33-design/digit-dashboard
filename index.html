                        signal.reason = 'Weak bullish momentum';
                        signal.strength = 'weak';
                    } else if (ma7Angle < -20 && ma20Angle < -10 && ma50Angle < 0) {
                        signal.side = 'BEARISH';
                        signal.reason = 'Strong bearish momentum across all MAs';
                        signal.strength = 'strong';
                    } else if (ma7Angle < -15 && ma20Angle < -5) {
                        signal.side = 'BEARISH';
                        signal.reason = 'Moderate bearish momentum (MA7 & MA20)';
                        signal.strength = 'moderate';
                    } else if (ma7Angle < -5 && ma20Angle < 0) {
                        signal.side = 'BEARISH';
                        signal.reason = 'Weak bearish momentum';
                        signal.strength = 'weak';
                    } else if (velocity && velocity.isAccelerating) {
                        if (velocity.momentumDirection === 'bullish') {
                            signal.side = 'BULLISH';
                            signal.reason = 'Momentum accelerating (velocity up)';
                            signal.strength = 'moderate';
                        } else if (velocity.momentumDirection === 'bearish') {
                            signal.side = 'BEARISH';
                            signal.reason = 'Momentum accelerating down (velocity down)';
                            signal.strength = 'moderate';
                        }
                    } else if ((ma7Angle > 0 && ma20Angle < 0) || (ma7Angle < 0 && ma20Angle > 0)) {
                        signal.side = 'WATCH';
                        signal.reason = 'Divergence between MA7 and MA20';
                        signal.strength = 'watch';
                    } else {
                        signal.side = 'NEUTRAL';
                        signal.reason = 'No clear momentum signal';
                        signal.strength = 'neutral';
                    }

                    return signal;
                }

                // ===== CONFLUENCE SIGNAL =====
                function getConfluenceSignal(sym) {
                    const data = marketData[sym];
                    if (!data || !data.priceHistory || data.priceHistory.length < 35) return null;
                    const candle = getCandle(sym);
                    let closes = [];
                    if (candle.history && candle.history.length > 0) {
                        closes = candle.history.map(c => c.close);
                    }
                    if (candle.close !== null) closes.push(candle.close);
                    if (closes.length < 35) closes = data.priceHistory.slice(-100);
                    if (closes.length < 35) return null;

                    const fresh = detectFreshCrossover(sym, closes);
                    if (!fresh) return null;

                    const {
                        sma7, sma20, macdLine, signalLine, histogram,
                        smaStatus, macdStatus,
                        smaFresh, macdFresh,
                        smaAge, macdAge,
                        smaDirection, macdDirection,
                        histFlip, crossover
                    } = fresh;

                    let signal = { type: 'confluence', side: 'NEUTRAL', reason: '', fresh: false, waitingFor: '' };

                    const hasFreshSMA = smaFresh && smaDirection !== 'none';
                    const hasFreshMACD = macdFresh && macdDirection !== 'none';

                    if (hasFreshSMA && !hasFreshMACD) {
                        if (smaDirection === 'bullish') {
                            signal.side = 'WATCH';
                            signal.reason = `⏳ FRESH SMA CROSS (${smaAge}c ago) → Waiting for MACD confirmation`;
                            signal.waitingFor = 'MACD';
                            signal.fresh = true;
                        } else if (smaDirection === 'bearish') {
                            signal.side = 'WATCH';
                            signal.reason = `⏳ FRESH SMA CROSS (${smaAge}c ago) → Waiting for MACD confirmation`;
                            signal.waitingFor = 'MACD';
                            signal.fresh = true;
                        }
                    } else if (hasFreshMACD && !hasFreshSMA) {
                        if (macdDirection === 'bullish') {
                            signal.side = 'WATCH';
                            signal.reason = `⏳ FRESH MACD CROSS (${macdAge}c ago) → Waiting for SMA confirmation`;
                            signal.waitingFor = 'SMA';
                            signal.fresh = true;
                        } else if (macdDirection === 'bearish') {
                            signal.side = 'WATCH';
                            signal.reason = `⏳ FRESH MACD CROSS (${macdAge}c ago) → Waiting for SMA confirmation`;
                            signal.waitingFor = 'SMA';
                            signal.fresh = true;
                        }
                    } else if (hasFreshSMA || hasFreshMACD || (smaFresh && macdFresh)) {
                        if (smaStatus === 'bullish' && macdStatus === 'bullish') {
                            signal.side = 'BUY';
                            signal.reason = `🚀 FRESH CONFIRMED BUY (SMA ${smaAge}c ago, MACD ${macdAge}c ago)`;
                            signal.fresh = true;
                        } else if (smaStatus === 'bearish' && macdStatus === 'bearish') {
                            signal.side = 'SELL';
                            signal.reason = `💥 FRESH CONFIRMED SELL (SMA ${smaAge}c ago, MACD ${macdAge}c ago)`;
                            signal.fresh = true;
                        } else {
                            if (hasFreshSMA) {
                                signal.side = 'WATCH';
                                signal.reason = `⏳ FRESH SMA CROSS (${smaAge}c ago) but MACD not aligned → Waiting for MACD`;
                                signal.waitingFor = 'MACD';
                                signal.fresh = true;
                            } else if (hasFreshMACD) {
                                signal.side = 'WATCH';
                                signal.reason = `⏳ FRESH MACD CROSS (${macdAge}c ago) but SMA not aligned → Waiting for SMA`;
                                signal.waitingFor = 'SMA';
                                signal.fresh = true;
                            }
                        }
                    } else {
                        signal.side = 'NEUTRAL';
                        signal.reason = `⏸️ No fresh crossover (SMA age ${smaAge}c, MACD age ${macdAge}c)`;
                        signal.fresh = false;
                    }

                    signal.smaFresh = smaFresh;
                    signal.macdFresh = macdFresh;
                    signal.smaAge = smaAge;
                    signal.macdAge = macdAge;
                    signal.smaStatus = smaStatus;
                    signal.macdStatus = macdStatus;
                    signal.sma7 = sma7;
                    signal.sma20 = sma20;
                    signal.macdLine = macdLine;
                    signal.signalLine = signalLine;
                    signal.histogram = histogram;
                    signal.crossover = crossover;
                    signal.histFlip = histFlip;

                    return signal;
                }

                // ---- VANILLA SIGNALS ----
                function getVanillaSignals(sym) {
                    let store = candleStore[sym];
                    if (!store || !store.open) store = { history: [], open: null };
                    let candles = store.history.slice();
                    if (store.open !== null && !store.isClosed) candles.push({ ...store });
                    let signals = [];
                    if (candles.length >= 3) {
                        let closes = candles.map(c => c.close);
                        let sma10 = calcSMA(closes, Math.min(10, candles.length));
                        if (sma10) {
                            let rsi = calcRSI(closes, Math.min(14, candles.length));
                            let prevRSI = calcRSI(closes.slice(0, -1), Math.min(14, candles.length - 1));
                            let currentPrice = closes[closes.length - 1];
                            if (currentPrice > sma10 && prevRSI < 50 && rsi >= 50) {
                                signals.push({ type: 'vanilla', side: 'UP', sma10: sma10.toFixed(4), rsi: rsi.toFixed(1) });
                            }
                            if (currentPrice < sma10 && prevRSI > 50 && rsi <= 50) {
                                signals.push({ type: 'vanilla', side: 'DOWN', sma10: sma10.toFixed(4), rsi: rsi.toFixed(1) });
                            }
                        }
                    }
                    const conSig = getConfluenceSignal(sym);
                    if (conSig) signals.push({ type: 'confluence', side: conSig.side, reason: conSig.reason, data: conSig,
                        fresh: conSig.fresh });
                    const progress = getConfluenceProgress(sym);
                    if (progress) signals.push({ type: 'confluence_progress', progress: progress });

                    const bbStatus = getBollingerStatus(sym);
                    if (bbStatus) {
                        let bbSignal = { type: 'bb_reversal', side: 'NEUTRAL', reason: '', confirmed: false };
                        if (bbStatus.touchUpper && !bbStatus.aboveUpper) {
                            bbSignal.side = 'SELL';
                            bbSignal.reason = '🔴 Upper band touched (overbought) – waiting for close inside';
                            if (bbStatus.confirmed) {
                                bbSignal.reason = '✅ CONFIRMED SELL – closed inside after upper touch';
                                bbSignal.confirmed = true;
                                bbSignal.side = 'SELL';
                            }
                        } else if (bbStatus.touchLower && !bbStatus.belowLower) {
                            bbSignal.side = 'BUY';
                            bbSignal.reason = '🟢 Lower band touched (oversold) – waiting for close inside';
                            if (bbStatus.confirmed) {
                                bbSignal.reason = '✅ CONFIRMED BUY – closed inside after lower touch';
                                bbSignal.confirmed = true;
                                bbSignal.side = 'BUY';
                            }
                        } else if (bbStatus.aboveUpper) {
                            bbSignal.side = 'WATCH';
                            bbSignal.reason = '📈 Price above upper band – strong bullish momentum';
                        } else if (bbStatus.belowLower) {
                            bbSignal.side = 'WATCH';
                            bbSignal.reason = '📉 Price below lower band – strong bearish momentum';
                        } else if (bbStatus.inside) {
                            bbSignal.side = 'NEUTRAL';
                            bbSignal.reason = '⚪ Price inside bands – no reversal signal';
                        }
                        bbSignal.bb = bbStatus.bb;
                        bbSignal.touchUpper = bbStatus.touchUpper;
                        bbSignal.touchLower = bbStatus.touchLower;
                        bbSignal.confirmed = bbStatus.confirmed;
                        signals.push(bbSignal);
                    }

                    const momentum = getMomentumAnalysis(sym);
                    if (momentum) {
                        signals.push({ type: 'momentum', data: momentum });
                    }

                    return signals;
                }

                function calcSMA(data, period) {
                    if (data.length < period) return null;
                    return data.slice(-period).reduce((a, b) => a + b, 0) / period;
                }

                function calcRSI(closes, period = 14) {
                    if (closes.length < period + 1) return 50;
                    let gains = 0, losses = 0;
                    for (let i = closes.length - period; i < closes.length; i++) {
                        let diff = closes[i] - closes[i - 1];
                        if (diff > 0) gains += diff;
                        else losses -= diff;
                    }
                    let avgGain = gains / period, avgLoss = losses / period;
                    if (avgLoss === 0) return 100;
                    return 100 - 100 / (1 + avgGain / avgLoss);
                }

                function getHybridStatus(sym) {
                    let data = marketData[sym];
                    if (!data || data.rollingArray.length < 50) return null;
                    let freqData = getDigitPercentages(sym, getSettings().analysisWindow);
                    if (!freqData) return null;
                    let mostDigits = Array.from(freqData.most);
                    let secondDigits = Array.from(freqData.second);
                    if (mostDigits.length === 0 || secondDigits.length === 0) return null;
                    const sets = [
                        { digits: [0, 2, 4], ouSide: 'UNDER', eoSide: 'EVEN', pair: 'UE' },
                        { digits: [4, 6, 8], ouSide: 'OVER', eoSide: 'EVEN', pair: 'OE' },
                        { digits: [5, 7, 9], ouSide: 'OVER', eoSide: 'ODD', pair: 'OO' },
                        { digits: [1, 3, 5], ouSide: 'UNDER', eoSide: 'ODD', pair: 'UO' }
                    ];
                    let target = null;
                    for (let s of sets) {
                        if (mostDigits.every(d => s.digits.includes(d)) && secondDigits.every(d => s.digits.includes(d))) {
                            target = s;
                            break;
                        }
                    }
                    if (!target) return null;
                    let last50 = data.rollingArray.slice(-50);
                    let overCount = last50.filter(d => d >= 5).length, underCount = 50 - overCount;
                    let evenCount = last50.filter(d => d % 2 === 0).length, oddCount = 50 - evenCount;
                    let overPct = (overCount / 50 * 100), evenPct = (evenCount / 50 * 100);
                    let underPct = 100 - overPct, oddPct = 100 - evenPct;
                    let threshold = getSettings().hybridThreshold;
                    let ouValue = target.ouSide === 'OVER' ? overPct : underPct;
                    let eoValue = target.eoSide === 'EVEN' ? evenPct : oddPct;
                    return {
                        pair: target.pair,
                        ouSide: target.ouSide,
                        eoSide: target.eoSide,
                        ouValue,
                        eoValue,
                        ouConfirmed: ouValue >= threshold,
                        eoConfirmed: eoValue >= threshold,
                        bothConfirmed: ouValue >= threshold && eoValue >= threshold,
                        threshold,
                        overCount, underCount, evenCount, oddCount,
                        overPct, underPct, evenPct, oddPct
                    };
                }

                function getPredictSignal(sym) {
                    let data = marketData[sym];
                    if (!data || data.lastDigit === null) return null;
                    let pred = getTopPrediction(sym, data.lastDigit);
                    if (!pred) return null;
                    let s = getSettings();
                    if (pred.percentage >= s.predThreshold) return { type: 'predict', digit: pred.nextDigit, percentage: pred.percentage };
                    return null;
                }

                function getSignal(sym) {
                    if (currentMarket === 'predict') return getPredictSignal(sym);
                    else if (currentMarket === 'overunder') return getOverUnderSignal(sym);
                    else if (currentMarket === 'evenodd') return getEvenOddSignal(sym);
                    else if (currentMarket === 'vanilla') return getVanillaSignals(sym);
                    else if (currentMarket === 'hybrid') return getHybridStatus(sym);
                    return [];
                }

                function applyPointerSettings(ptr, scale) {
                    let style = ptr.style;
                    if (ptr.classList.contains('triangle')) {
                        style.borderLeftWidth = (5 * scale) + 'px';
                        style.borderRightWidth = (5 * scale) + 'px';
                        style.borderBottomWidth = (7 * scale) + 'px';
                    } else if (ptr.classList.contains('arrow')) {
                        style.fontSize = (0.9 * scale) + 'rem';
                    } else if (ptr.classList.contains('dot')) {
                        style.width = (6 * scale) + 'px';
                        style.height = (6 * scale) + 'px';
                    }
                }

                // ===== INSTANT ANALYSIS FUNCTIONS =====
                function detectConsolidation(candles, lookback, thresholdPercent) {
                    if (!candles || candles.length < lookback) return null;
                    const slice = candles.slice(-lookback);
                    const highs = slice.map(c => c.high);
                    const lows = slice.map(c => c.low);
                    const range = Math.max(...highs) - Math.min(...lows);
                    const avgPrice = (Math.max(...highs) + Math.min(...lows)) / 2;
                    if (range / avgPrice < thresholdPercent) {
                        return {
                            high: Math.max(...highs),
                            low: Math.min(...lows),
                            range: range,
                            avgPrice: avgPrice,
                            startIndex: candles.length - lookback,
                            endIndex: candles.length - 1
                        };
                    }
                    return null;
                }

                function detectBreakout(candles, consolidation, currentPrice) {
                    if (!consolidation) return null;
                    const high = consolidation.high;
                    const low = consolidation.low;
                    const breakoutBuffer = (high - low) * 0.05;
                    if (currentPrice > high + breakoutBuffer) {
                        return { direction: 'UP', level: high, price: currentPrice };
                    } else if (currentPrice < low - breakoutBuffer) {
                        return { direction: 'DOWN', level: low, price: currentPrice };
                    }
                    return null;
                }

                function detectTrendlines(candles, lookback) {
                    if (!candles || candles.length < lookback) return { uptrendLine: null, downtrendLine: null };
                    const slice = candles.slice(-lookback);
                    const highs = slice.map(c => c.high);
                    const lows = slice.map(c => c.low);
                    const swingHighs = [];
                    const swingLows = [];
                    for (let i = 2; i < highs.length - 2; i++) {
                        if (highs[i] > highs[i-1] && highs[i] > highs[i-2] &&
                            highs[i] >= highs[i+1] && highs[i] >= highs[i+2]) {
                            swingHighs.push({ index: i, price: highs[i], time: slice[i].minute });
                        }
                        if (lows[i] < lows[i-1] && lows[i] < lows[i-2] &&
                            lows[i] <= lows[i+1] && lows[i] <= lows[i+2]) {
                            swingLows.push({ index: i, price: lows[i], time: slice[i].minute });
                        }
                    }
                    let uptrendLine = null, downtrendLine = null;
                    if (swingLows.length >= 2) {
                        const sorted = swingLows.sort((a, b) => a.index - b.index);
                        const first = sorted[0], last = sorted[sorted.length - 1];
                        if (last.index > first.index) {
                            const slope = (last.price - first.price) / (last.index - first.index);
                            if (slope > 0) {
                                uptrendLine = { start: first, end: last, slope: slope };
                            }
                        }
                    }
                    if (swingHighs.length >= 2) {
                        const sorted = swingHighs.sort((a, b) => a.index - b.index);
                        const first = sorted[0], last = sorted[sorted.length - 1];
                        if (last.index > first.index) {
                            const slope = (last.price - first.price) / (last.index - first.index);
                            if (slope < 0) {
                                downtrendLine = { start: first, end: last, slope: slope };
                            }
                        }
                    }
                    return { uptrendLine, downtrendLine };
                }

                // ---- GET MARKET STRUCTURE STATUS ----
                function getMarketStructureStatus(sym) {
                    const data = marketData[sym];
                    if (!data || !data.priceHistory || data.priceHistory.length < 20) {
                        return { status: 'waiting', label: '⏳ Analyzing...', color: 'var(--text-secondary)' };
                    }
                    const candle = getCandle(sym);
                    let candles = [];
                    if (candle.history && candle.history.length > 0) {
                        candles = candle.history.slice();
                    }
                    if (candle.close !== null && !candle.isClosed) {
                        candles.push({ open: candle.open, high: candle.high, low: candle.low, close: candle.close, minute: candle.minute });
                    }
                    if (candles.length < 20) return { status: 'waiting', label: '⏳ Need more candles...', color: 'var(--text-secondary)' };

                    const currentPrice = data.lastPrice;
                    const settings = getSettings();
                    const lookback = settings.consLookback || 20;
                    const threshold = 0.008;

                    const cons = detectConsolidation(candles, lookback, threshold);
                    const breakout = cons ? detectBreakout(candles, cons, currentPrice) : null;
                    const trends = detectTrendlines(candles, 30);

                    let status = 'trending';
                    let label = '📈 TRENDING';
                    let color = '#3b82f6';
                    let details = '';

                    if (cons && breakout) {
                        if (breakout.direction === 'UP') {
                            status = 'breakout-up';
                            label = '🚀 BREAKOUT (UP)';
                            color = 'var(--breakout-up)';
                            details = `Broke above ${cons.high.toFixed(4)}`;
                        } else if (breakout.direction === 'DOWN') {
                            status = 'breakout-down';
                            label = '💥 BREAKOUT (DOWN)';
                            color = 'var(--breakout-down)';
                            details = `Broke below ${cons.low.toFixed(4)}`;
                        }
                    } else if (cons) {
                        status = 'consolidation';
                        label = '🔄 CONSOLIDATION';
                        color = 'var(--consolidation-color)';
                        details = `Range ${cons.low.toFixed(4)} – ${cons.high.toFixed(4)}`;
                    } else {
                        if (trends.uptrendLine) {
                            const slope = trends.uptrendLine.slope;
                            if (slope > 0.0005) {
                                status = 'trending';
                                label = '📈 UPTREND';
                                color = '#10b981';
                                details = `Trendline slope ${(slope*100).toFixed(2)}%`;
                            } else if (slope < -0.0005) {
                                status = 'trending';
                                label = '📉 DOWNTREND';
                                color = '#ef4444';
                                details = `Trendline slope ${(slope*100).toFixed(2)}%`;
                            }
                        }
                        if (status === 'trending') {
                            if (trends.uptrendLine) label = '📈 UPTREND';
                            else if (trends.downtrendLine) label = '📉 DOWNTREND';
                        }
                    }

                    return {
                        status: status,
                        label: label,
                        color: color,
                        details: details,
                        consolidation: cons,
                        breakout: breakout,
                        trends: trends,
                        currentPrice: currentPrice
                    };
                }

                // ---- CONFLUENCE PROGRESS ----
                function getConfluenceProgress(sym) {
                    const data = marketData[sym];
                    if (!data || !data.priceHistory || data.priceHistory.length < 35) return null;
                    const candle = getCandle(sym);
                    let closes = [];
                    if (candle.history && candle.history.length > 0) {
                        closes = candle.history.map(c => c.close);
                    }
                    if (candle.close !== null) closes.push(candle.close);
                    if (closes.length < 35) closes = data.priceHistory.slice(-100);
                    if (closes.length < 35) return null;

                    const fresh = detectFreshCrossover(sym, closes);
                    if (!fresh) return {
                        sma7: null, sma20: null,
                        macd: { line: 0, signal: 0, histogram: 0 },
                        crossover: 'none', histFlip: false, trend: 'neutral',
                        messages: ['⏳ No crossover data'],
                        resistance: [], support: [], trends: null,
                        currentPrice: data.lastPrice
                    };

                    const sr = detectSupportResistance(sym);
                    const trends = detectTrendlines(candle.history, 30);

                    let messages = [];
                    let trend = 'neutral';

                    if (fresh.smaFresh || fresh.macdFresh) {
                        if (fresh.smaStatus === 'bullish' && fresh.macdStatus === 'bullish') {
                            trend = 'bullish';
                            messages.push(`🚀 FRESH BUY SIGNAL (SMA ${fresh.smaAge}c ago, MACD ${fresh.macdAge}c ago)`);
                        } else if (fresh.smaStatus === 'bearish' && fresh.macdStatus === 'bearish') {
                            trend = 'bearish';
                            messages.push(`💥 FRESH SELL SIGNAL (SMA ${fresh.smaAge}c ago, MACD ${fresh.macdAge}c ago)`);
                        } else if (fresh.smaFresh) {
                            messages.push(`⏳ FRESH SMA CROSS (${fresh.smaAge}c ago) → Waiting for MACD`);
                        } else if (fresh.macdFresh) {
                            messages.push(`⏳ FRESH MACD CROSS (${fresh.macdAge}c ago) → Waiting for SMA`);
                        }
                    } else {
                        messages.push(`⏸️ No fresh crossover (SMA ${fresh.smaAge}c ago, MACD ${fresh.macdAge}c ago)`);
                    }

                    return {
                        sma7: fresh.sma7,
                        sma20: fresh.sma20,
                        macd: { line: fresh.macdLine, signal: fresh.signalLine, histogram: fresh.histogram },
                        crossover: fresh.crossover || 'none',
                        histFlip: fresh.histFlip || false,
                        trend: trend,
                        messages: messages,
                        resistance: sr ? sr.resistance : [],
                        support: sr ? sr.support : [],
                        trends: trends,
                        currentPrice: data.lastPrice
                    };
                }

                // ---- GET LEVEL PREDICTIONS ----
                function getLevelPrediction(sym) {
                    const data = marketData[sym];
                    if (!data || !data.priceHistory || data.priceHistory.length < 50) return [];
                    const candle = getCandle(sym);
                    let candles = [];
                    if (candle.history && candle.history.length > 0) {
                        candles = candle.history.slice();
                    }
                    if (candle.close !== null && !candle.isClosed) {
                        candles.push({ open: candle.open, high: candle.high, low: candle.low, close: candle.close, minute: candle.minute });
                    }
                    if (candles.length < 20) return [];

                    const cache = _analysisCache[sym];
                    const currentCandleCount = candles.length;
                    if (cache && cache.lastCandleCount === currentCandleCount) {
                        if (currentCandleCount >= 20) {
                            return cache.predictions || [];
                        }
                    }

                    const currentPrice = data.lastPrice;
                    const sr = detectSupportResistance(sym);
                    const trends = detectTrendlines(candles, 30);
                    const volatility = calculateVolatility(candles);

                    const predictions = [];

                    if (sr && sr.resistance) {
                        for (let r of sr.resistance) {
                            if (r.level > currentPrice) {
                                const est = estimateCandlesToTarget(currentPrice, r.level, candles, volatility * 10);
                                predictions.push({
                                    type: 'resistance',
                                    level: r.level,
                                    candles: est.candles,
                                    confidence: est.confidence,
                                    timeEstimate: est.candles * 60,
                                    avgMove: est.avgCandleMove,
                                    momentum: est.momentum
                                });
                            }
                        }
                    }

                    if (sr && sr.support) {
                        for (let s of sr.support) {
                            if (s.level < currentPrice) {
                                const est = estimateCandlesToTarget(currentPrice, s.level, candles, volatility * 10);
                                predictions.push({
                                    type: 'support',
                                    level: s.level,
                                    candles: est.candles,
                                    confidence: est.confidence,
                                    timeEstimate: est.candles * 60,
                                    avgMove: est.avgCandleMove,
                                    momentum: est.momentum
                                });
                            }
                        }
                    }

                    if (trends.uptrendLine) {
                        const tl = trends.uptrendLine;
                        const lastIndex = candles.length - 1;
                        const projectedPrice = tl.start.price + tl.slope * (lastIndex - tl.start.index);
                        if (projectedPrice > currentPrice) {
                            const est = estimateCandlesToTarget(currentPrice, projectedPrice, candles, volatility * 10);
                            predictions.push({
                                type: 'trendline_up',
                                level: projectedPrice,
                                candles: est.candles,
                                confidence: Math.min(est.confidence, 70),
                                timeEstimate: est.candles * 60,
                                avgMove: est.avgCandleMove,
                                momentum: est.momentum,
                                trendSlope: tl.slope
                            });
                        }
                    }
                    if (trends.downtrendLine) {
                        const tl = trends.downtrendLine;
                        const lastIndex = candles.length - 1;
                        const projectedPrice = tl.start.price + tl.slope * (lastIndex - tl.start.index);
                        if (projectedPrice < currentPrice) {
                            const est = estimateCandlesToTarget(currentPrice, projectedPrice, candles, volatility * 10);
                            predictions.push({
                                type: 'trendline_down',
                                level: projectedPrice,
                                candles: est.candles,
                                confidence: Math.min(est.confidence, 70),
                                timeEstimate: est.candles * 60,
                                avgMove: est.avgCandleMove,
                                momentum: est.momentum,
                                trendSlope: tl.slope
                            });
                        }
                    }

                    predictions.sort((a, b) => a.candles - b.candles);
                    const topPredictions = predictions.slice(0, 5);

                    if (!_analysisCache[sym]) _analysisCache[sym] = {};
                    _analysisCache[sym].predictions = topPredictions;
                    _analysisCache[sym].lastCandleCount = currentCandleCount;
                    _analysisCache[sym].timestamp = Date.now();
                    _analysisCache[sym].sr = sr;
                    _analysisCache[sym].trends = trends;
                    _analysisCache[sym].volatility = volatility;
                    const settings = getSettings();
                    const cons = detectConsolidation(candles, settings.consLookback || 20, 0.008);
                    _analysisCache[sym].cons = cons;
                    _analysisCache[sym].breakout = cons ? detectBreakout(candles, cons, currentPrice) : null;

                    return topPredictions;
                }

                function calculateVolatility(candles, lookback = 20) {
                    if (!candles || candles.length < lookback + 1) return 0.01;
                    const slice = candles.slice(-lookback);
                    const returns = [];
                    for (let i = 1; i < slice.length; i++) {
                        if (slice[i - 1].close > 0) {
                            returns.push((slice[i].close - slice[i - 1].close) / slice[i - 1].close);
                        }
                    }
                    if (returns.length < 2) return 0.01;
                    const mean = returns.reduce((a, b) => a + b, 0) / returns.length;
                    const variance = returns.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / returns.length;
                    return Math.sqrt(variance);
                }

                function estimateCandlesToTarget(currentPrice, targetPrice, candles, volatilityFactor) {
                    const distance = Math.abs(targetPrice - currentPrice);
                    const avgRange = candles.length > 0 ? candles.slice(-20).reduce((sum, c) => sum + (c.high - c.low), 0) / Math.min(20, candles.length) : 0.001;
                    const closes = candles.slice(-5).map(c => c.close);
                    const momentum = closes.length >= 2 ? (closes[closes.length - 1] - closes[0]) / closes.length : 0;
                    let dailyProgress = avgRange * volatilityFactor;
                    if (Math.sign(targetPrice - currentPrice) === Math.sign(momentum)) {
                        dailyProgress += Math.abs(momentum);
                    } else {
                        dailyProgress -= Math.abs(momentum) * 0.5;
                    }
                    dailyProgress = Math.max(dailyProgress, 0.0001);
                    const estimatedCandles = Math.ceil(distance / dailyProgress);
                    const conf = Math.min(100, Math.max(20, 100 - (volatilityFactor * 30)));
                    return {
                        candles: estimatedCandles,
                        confidence: Math.round(conf),
                        avgCandleMove: avgRange,
                        momentum: momentum
                    };
                }

                // ---- RENDER CANDLE DISPLAY ----
                function renderCandleDisplay(sym) {
                    const candle = getCandle(sym);
                    const changeEl = document.getElementById(`candleChange_${sym}`);
                    const timerEl = document.getElementById(`candleTimer_${sym}`);
                    const statusEl = document.getElementById(`candleStatus_${sym}`);
                    const rangeEl = document.getElementById(`candleRange_${sym}`);
                    const svgWrapEl = document.getElementById(`candleSvgWrap_${sym}`);
                    if (!candle || candle.open === null || !changeEl) {
                        if (svgWrapEl) svgWrapEl.innerHTML = '';
                        if (statusEl) statusEl.innerText = '⏳ Waiting...';
                        return;
                    }
                    const change = getCandleChange(candle);
                    const isUp = change.direction === 'up';
                    const isDown = change.direction === 'down';
                    const changeStr = change.direction === 'flat' ? '0.00' : (isUp ? '+' : '') + change.change.toFixed(2);
                    const pctStr = change.direction === 'flat' ? '0.00' : (isUp ? '+' : '') + change.pct.toFixed(2) + '%';
                    const dirSymbol = isUp ? '▲' : isDown ? '▼' : '—';
                    changeEl.innerText = `${dirSymbol} ${changeStr} (${pctStr})`;
                    changeEl.className = `candle-change ${change.direction}`;
                    const now = Date.now();
                    const elapsed = (now - candle.minute) / 1000;
                    const remaining = Math.max(0, 60 - elapsed);
                    const remainingSec = Math.floor(remaining);
                    const timerStr = remainingSec + 's';
                    timerEl.innerText = `⏱️ ${timerStr}`;
                    timerEl.className = `candle-timer${remainingSec <= 5 ? ' warning' : ''}`;
                    const open = candle.open;
                    const close = candle.close;
                    const high = candle.high || open;
                    const low = candle.low || open;
                    const range = high - low;
                    let statusText = candle.isClosed ? '🟢 Closed' : `⏳ ${candle.tickCount} ticks · ${timerStr}`;
                    statusEl.innerText = statusText;
                    rangeEl.innerText = `Range: ${range.toFixed(2)}`;

                    const svgWidth = 50;
                    const svgHeight = 100;
                    const centerX = svgWidth / 2;
                    const bodyWidth = 12;
                    const xBody = centerX - bodyWidth / 2;

                    let svg = `<svg viewBox="0 0 ${svgWidth} ${svgHeight}" preserveAspectRatio="none" style="width:100%;height:100%;background:transparent;">`;

                    if (range === 0) {
                        svg += `<line x1="10" y1="50" x2="40" y2="50" stroke="var(--text-secondary)" stroke-width="2" stroke-dasharray="2,2" />`;
                    } else {
                        const color = isUp ? 'var(--candle-up)' : 'var(--candle-down)';
                        let yOpen = ((high - open) / range) * 100;
                        let yClose = ((high - close) / range) * 100;
                        yOpen = Math.min(98, Math.max(2, yOpen));
                        yClose = Math.min(98, Math.max(2, yClose));
                        const yBodyTop = Math.min(yOpen, yClose);
                        const yBodyBottom = Math.max(yOpen, yClose);
                        const bodyHeight = Math.max(1, yBodyBottom - yBodyTop);
                        svg += `
                            <line x1="${centerX}" y1="0" x2="${centerX}" y2="${yBodyTop}" stroke="${color}" stroke-width="2" />
                            <line x1="${centerX}" y1="${yBodyBottom}" x2="${centerX}" y2="${svgHeight}" stroke="${color}" stroke-width="2" />
                            <rect x="${xBody}" y="${yBodyTop}" width="${bodyWidth}" height="${bodyHeight}" fill="${color}" opacity="0.9" />
                            ${bodyHeight <= 1 ? `<line x1="${xBody}" y1="${yBodyTop}" x2="${xBody + bodyWidth}" y2="${yBodyTop}" stroke="${color}" stroke-width="2" />` : ''}
                            <text x="4" y="${Math.min(98, yOpen + 3)}" font-size="8" fill="${color}" font-weight="bold" text-anchor="end">O</text>
                            <text x="${svgWidth - 4}" y="${Math.min(98, yClose + 3)}" font-size="8" fill="${color}" font-weight="bold" text-anchor="start">C</text>
                        `;
                    }

                    // ---- OVERLAYS (only in vanilla mode) ----
                    if (currentMarket === 'vanilla') {
                        const currentPrice = marketData[sym]?.lastPrice;
                        if (currentPrice !== undefined && currentPrice !== null) {
                            const cache = _analysisCache[sym];
                            const candles = [];
                            if (candle.history && candle.history.length > 0) {
                                candles.push(...candle.history);
                            }
                            if (candle.close !== null && !candle.isClosed) {
                                candles.push({ open: candle.open, high: candle.high, low: candle.low, close: candle.close, minute: candle.minute });
                            }

                            let sr = cache?.sr;
                            let trends = cache?.trends;
                            let cons = cache?.cons;
                            let breakout = cache?.breakout;

                            if (!sr || !trends || !cons || cache?.lastCandleCount !== candles.length) {
                                sr = detectSupportResistance(sym);
                                trends = detectTrendlines(candles, 30);
                                const settings = getSettings();
                                cons = detectConsolidation(candles, settings.consLookback || 20, 0.008);
                                breakout = cons ? detectBreakout(candles, cons, currentPrice) : null;
                                if (!_analysisCache[sym]) _analysisCache[sym] = {};
                                _analysisCache[sym].sr = sr;
                                _analysisCache[sym].trends = trends;
                                _analysisCache[sym].cons = cons;
                                _analysisCache[sym].breakout = breakout;
                                _analysisCache[sym].lastCandleCount = candles.length;
                            }

                            const rangePercent = 0.05;
                            const minPrice = currentPrice * (1 - rangePercent);
                            const maxPrice = currentPrice * (1 + rangePercent);
                            const priceToY = (price) => {
                                return svgHeight - ((price - minPrice) / (maxPrice - minPrice)) * svgHeight;
                            };

                            // Bollinger Bands
                            const bbStatus = getBollingerStatus(sym);
                            if (bbStatus && bbStatus.bb) {
                                const bb = bbStatus.bb;
                                const yUpper = priceToY(bb.upper);
                                const yMiddle = priceToY(bb.middle);
                                const yLower = priceToY(bb.lower);
                                if (yUpper >= 0 && yUpper <= svgHeight) {
                                    svg += `<line x1="0" y1="${yUpper}" x2="100%" y2="${yUpper}" stroke="var(--bb-upper)" stroke-width="1.2" stroke-dasharray="2,2" opacity="0.8" />`;
                                    svg += `<text x="2" y="${yUpper - 2}" font-size="5" fill="var(--bb-upper)">BB↑</text>`;
                                }
                                if (yMiddle >= 0 && yMiddle <= svgHeight) {
                                    svg += `<line x1="0" y1="${yMiddle}" x2="100%" y2="${yMiddle}" stroke="var(--bb-middle)" stroke-width="1" opacity="0.6" />`;
                                }
                                if (yLower >= 0 && yLower <= svgHeight) {
                                    svg += `<line x1="0" y1="${yLower}" x2="100%" y2="${yLower}" stroke="var(--bb-lower)" stroke-width="1.2" stroke-dasharray="2,2" opacity="0.8" />`;
                                    svg += `<text x="2" y="${yLower + 10}" font-size="5" fill="var(--bb-lower)">BB↓</text>`;
                                }
                                if (bbStatus.touchUpper) {
                                    svg += `<circle cx="${svgWidth - 4}" cy="${yUpper}" r="2" fill="#ef4444" />`;
                                    svg += `<text x="${svgWidth - 12}" y="${yUpper - 4}" font-size="5" fill="#ef4444">T</text>`;
                                }
                                if (bbStatus.touchLower) {
                                    svg += `<circle cx="${svgWidth - 4}" cy="${yLower}" r="2" fill="#4ade80" />`;
                                    svg += `<text x="${svgWidth - 12}" y="${yLower + 12}" font-size="5" fill="#4ade80">T</text>`;
                                }
                            }

                            // Consolidation
                            if (cons) {
                                const yHigh = priceToY(cons.high);
                                const yLow = priceToY(cons.low);
                                const width = svgWidth;
                                svg += `<rect x="0" y="${Math.min(yHigh, yLow)}" width="${width}" height="${Math.abs(yHigh - yLow)}" fill="rgba(250, 204, 21, 0.25)" stroke="rgba(250, 204, 21, 0.7)" stroke-width="1.5" />`;
                                svg += `<text x="2" y="${Math.min(yHigh, yLow) + 10}" font-size="7" fill="#facc15" font-weight="bold">CONS</text>`;
                            }

                            if (breakout) {
                                const y = priceToY(breakout.direction === 'UP' ? breakout.level : breakout.level);
                                const arrowColor = breakout.direction === 'UP' ? '#10b981' : '#ef4444';
                                const arrowDir = breakout.direction === 'UP' ? '▲' : '▼';
                                svg += `<text x="${svgWidth / 2}" y="${breakout.direction === 'UP' ? y - 8 : y + 18}" font-size="14" fill="${arrowColor}" font-weight="bold" text-anchor="middle">${arrowDir}</text>`;
                                svg += `<text x="2" y="${breakout.direction === 'UP' ? y - 2 : y + 28}" font-size="7" fill="${arrowColor}" font-weight="bold">${breakout.direction === 'UP' ? 'BO UP' : 'BO DOWN'}</text>`;
                            }

                            // Support / Resistance
                            if (sr && sr.support) {
                                for (let s of sr.support) {
                                    const y = priceToY(s.level);
                                    if (y >= 0 && y <= svgHeight) {
                                        svg += `<line x1="0" y1="${y}" x2="100%" y2="${y}" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.7" />`;
                                        svg += `<text x="2" y="${y - 2}" font-size="8" fill="#10b981" font-weight="bold">S</text>`;
                                    }
                                }
                            }
                            if (sr && sr.resistance) {
                                for (let r of sr.resistance) {
                                    const y = priceToY(r.level);
                                    if (y >= 0 && y <= svgHeight) {
                                        svg += `<line x1="0" y1="${y}" x2="100%" y2="${y}" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.7" />`;
                                        svg += `<text x="2" y="${y + 12}" font-size="8" fill="#ef4444" font-weight="bold">R</text>`;
                                    }
                                }
                            }

                            // Trendlines
                            if (trends) {
                                if (trends.uptrendLine && trends.uptrendLine.start && trends.uptrendLine.end) {
                                    const startIdx = trends.uptrendLine.start.index;
                                    const endIdx = trends.uptrendLine.end.index;
                                    const totalCandles = candles.length;
                                    const xScale = svgWidth / Math.max(totalCandles, 30);
                                    const x1 = Math.min(Math.max(startIdx * xScale, 0), svgWidth);
                                    const x2 = Math.min(Math.max(endIdx * xScale, 0), svgWidth);
                                    const y1 = priceToY(trends.uptrendLine.start.price);
                                    const y2 = priceToY(trends.uptrendLine.end.price);
                                    if (y1 >= 0 && y1 <= svgHeight && y2 >= 0 && y2 <= svgHeight) {
                                        svg += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.8" />`;
                                        svg += `<text x="${x2 + 2}" y="${y2 - 2}" font-size="6" fill="#3b82f6">↗ TL</text>`;
                                    }
                                }
                                if (trends.downtrendLine && trends.downtrendLine.start && trends.downtrendLine.end) {
                                    const startIdx = trends.downtrendLine.start.index;
                                    const endIdx = trends.downtrendLine.end.index;
                                    const totalCandles = candles.length;
                                    const xScale = svgWidth / Math.max(totalCandles, 30);
                                    const x1 = Math.min(Math.max(startIdx * xScale, 0), svgWidth);
                                    const x2 = Math.min(Math.max(endIdx * xScale, 0), svgWidth);
                                    const y1 = priceToY(trends.downtrendLine.start.price);
                                    const y2 = priceToY(trends.downtrendLine.end.price);
                                    if (y1 >= 0 && y1 <= svgHeight && y2 >= 0 && y2 <= svgHeight) {
                                        svg += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#f97316" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.8" />`;
                                        svg += `<text x="${x2 + 2}" y="${y2 + 10}" font-size="6" fill="#f97316">↘ TL</text>`;
                                    }
                                }
                            }
                        }
                    }

                    svg += '</svg>';
                    svgWrapEl.innerHTML = svg;
                }

                // ---- RENDER PREDICTIONS ----
                function renderPredictions(sym) {
                    const container = document.getElementById(`predictions_${sym}`);
                    if (!container) return;

                    if (currentMarket !== 'vanilla') {
                        container.style.display = 'none';
                        return;
                    }
                    container.style.display = 'flex';

                    const structure = getMarketStructureStatus(sym);
                    const conSig = getConfluenceSignal(sym);
                    const bbStatus = getBollingerStatus(sym);
                    const momentum = getMomentumAnalysis(sym);

                    let html = `<div class="prediction-title">🎯 MOMENTUM ANALYSIS</div>`;

                    // ---- Momentum Panel ----
                    if (momentum && momentum.analysis) {
                        const overall = momentum.overall;
                        let overallColor = 'neutral';
                        if (overall.status === 'strong-bullish' || overall.status === 'moderate-bullish') overallColor = 'strong-bullish';
                        else if (overall.status === 'strong-bearish' || overall.status === 'moderate-bearish') overallColor = 'strong-bearish';

                        html += `
                            <div class="momentum-status ${overallColor}" style="margin-bottom:0.1rem;">
                                ${overall.emoji} Overall: ${overall.label} (${overall.bullishCount} bullish / ${overall.bearishCount} bearish MAs)
                            </div>
                        `;

                        html += `<div class="momentum-grid">`;
                        const periods = ['MA7', 'MA14', 'MA20', 'MA50'];
                        for (let p of periods) {
                            const data = momentum.analysis[p];
                            if (data) {
                                const color = data.css;
                                html += `
                                    <div class="momentum-item">
                                        <span class="label">${p}</span>
                                        <span class="value" style="color:var(--${color});">
                                            ${data.emoji} ${data.label}
                                            <span style="font-weight:400;font-size:0.5rem;opacity:0.6;">(${data.angle.toFixed(1)}°)</span>
                                        </span>
                                    </div>
                                `;
                            }
                        }
                        html += `</div>`;

                        if (momentum.velocity) {
                            const v = momentum.velocity;
                            let velText = v.velocityText === 'accelerating' ? '⬆ ACCELERATING' :
                                v.velocityText === 'decelerating' ? '⬇ DECELERATING' : '➡️ STABLE';
                            let velClass = v.velocityText === 'accelerating' ? 'accel' :
                                v.velocityText === 'decelerating' ? 'decel' : 'stable';
                            html += `
                                <div class="momentum-velocity">
                                    Velocity: <span class="${velClass}">${velText}</span>
                                    ${v.isAccelerating ? '🚀' : v.isDecelerating ? '⚠️' : ''}
                                    (${v.currentAngle.toFixed(1)}° currently)
                                </div>
                            `;
                        }

                        if (momentum.signal && momentum.signal.side !== 'NEUTRAL') {
                            const sigColor = momentum.signal.side === 'BULLISH' ? '#4ade80' : '#f87171';
                            html += `
                                <div class="momentum-status" style="color:${sigColor};font-size:0.7rem;padding:0.1rem 0;">
                                    📊 ${momentum.signal.side}: ${momentum.signal.reason}
                                    ${momentum.signal.strength === 'strong' ? '💪' : ''}
                                </div>
                            `;
                        }

                    } else {
                        html += `<div class="prediction-chip" style="border-color:var(--border-color);">⏳ Building momentum data (need 30+ candles)...</div>`;
                    }

                    // ---- Existing indicators ----
                    html += `<div class="prediction-title" style="margin-top:0.2rem;">📊 CROSSOVER & BB</div>`;

                    if (conSig) {
                        let signalClass = 'neutral';
                        let signalText = '⚪ NEUTRAL';
                        let signalColor = 'var(--text-secondary)';
                        let isFresh = conSig.fresh || false;

                        if (conSig.side === 'BUY' && isFresh) {
                            signalClass = 'buy-confirmed fresh';
                            signalText = `🚀 FRESH BUY (SMA ${conSig.smaAge}c ago, MACD ${conSig.macdAge}c ago)`;
                            signalColor = 'var(--confirmed-buy)';
                        } else if (conSig.side === 'SELL' && isFresh) {
                            signalClass = 'sell-confirmed fresh';
                            signalText = `💥 FRESH SELL (SMA ${conSig.smaAge}c ago, MACD ${conSig.macdAge}c ago)`;
                            signalColor = 'var(--confirmed-sell)';
                        } else if (conSig.side === 'WATCH' && isFresh) {
                            signalClass = 'waiting';
                            signalText = conSig.reason;
                            signalColor = 'var(--waiting-color)';
                        } else if (conSig.side === 'NEUTRAL') {
                            signalClass = 'stale';
                            signalText = conSig.reason || '⏸️ No fresh crossover';
                            signalColor = 'var(--stale-color)';
                        } else {
                            signalClass = 'neutral';
                            signalText = '⚪ No signal';
                            signalColor = 'var(--text-secondary)';
                        }

                        html += `
                            <div class="market-status-badge ${signalClass}" style="border-color:${signalColor};color:${signalColor};margin-bottom:0.2rem;font-size:0.6rem;padding:0.15rem 0.5rem;">
                                <span class="status-icon" style="font-size:0.8rem;">${signalText.includes('BUY') ? '🚀' : signalText.includes('SELL') ? '💥' : signalText.includes('WAITING') ? '⏳' : '⚪'}</span>
                                ${signalText}
                            </div>
                        `;
                    } else {
                        html += `<div class="prediction-chip" style="border-color:var(--border-color);">⏳ No crossover data</div>`;
                    }

                    if (bbStatus && bbStatus.bb) {
                        const bb = bbStatus.bb;
                        let bbSignalText = '';
                        let bbColor = 'var(--text-secondary)';
                        if (bbStatus.touchUpper && bbStatus.confirmed) {
                            bbSignalText = '✅ CONFIRMED SELL (upper touch → inside)';
                            bbColor = 'var(--confirmed-sell)';
                        } else if (bbStatus.touchUpper && !bbStatus.aboveUpper) {
                            bbSignalText = '🔴 Upper band touched – waiting for close inside';
                            bbColor = '#ef4444';
                        } else if (bbStatus.touchLower && bbStatus.confirmed) {
                            bbSignalText = '✅ CONFIRMED BUY (lower touch → inside)';
                            bbColor = 'var(--confirmed-buy)';
                        } else if (bbStatus.touchLower && !bbStatus.belowLower) {
                            bbSignalText = '🟢 Lower band touched – waiting for close inside';
                            bbColor = '#4ade80';
                        } else if (bbStatus.aboveUpper) {
                            bbSignalText = '📈 Price above upper band – strong bullish momentum';
                            bbColor = '#facc15';
                        } else if (bbStatus.belowLower) {
                            bbSignalText = '📉 Price below lower band – strong bearish momentum';
                            bbColor = '#facc15';
                        } else {
                            bbSignalText = '⚪ Inside bands – no reversal signal';
                            bbColor = 'var(--text-secondary)';
                        }

                        html += `
                            <div class="market-status-badge" style="border-color:${bbColor};color:${bbColor};font-size:0.6rem;padding:0.15rem 0.5rem;">
                                <span class="status-icon" style="font-size:0.8rem;">${bbSignalText.includes('CONFIRMED') ? '✅' : bbSignalText.includes('touched') ? '🔔' : '📊'}</span>
                                ${bbSignalText}
                            </div>
                            <div style="display:flex;justify-content:space-between;font-size:0.5rem;color:var(--text-secondary);padding:0.05rem 0.1rem;">
                                <span>U: ${bb.upper.toFixed(4)}</span>
                                <span>M: ${bb.middle.toFixed(4)}</span>
                                <span>L: ${bb.lower.toFixed(4)}</span>
                            </div>
                        `;
                    } else {
                        html += `<div class="prediction-chip" style="border-color:var(--border-color);">⏳ Need 20 candles for BB</div>`;
                    }

                    // Candle estimates
                    const predictions = getLevelPrediction(sym);
                    html += `<div class="prediction-title" style="margin-top:0.1rem;">🎯 CANDLE ESTIMATES</div><div class="predictions-grid">`;

                    if (!predictions.length) {
                        html += `<div class="prediction-chip" style="border-color:var(--border-color);">⏳ Analyzing...</div>`;
                    } else {
                        let levels = { resistance: null, support: null, trendline: null };
                        for (let p of predictions) {
                            if (p.type === 'resistance' && !levels.resistance) levels.resistance = p;
                            if (p.type === 'support' && !levels.support) levels.support = p;
                            if ((p.type === 'trendline_up' || p.type === 'trendline_down') && !levels.trendline) levels.trendline = p;
                            if (levels.resistance && levels.support && levels.trendline) break;
                        }

                        const displayLevels = [levels.resistance, levels.support, levels.trendline].filter(p => p !== null);

                        for (let p of displayLevels) {
                            const color = p.type === 'resistance' ? '#ef4444' :
                                p.type === 'support' ? '#10b981' :
                                p.type === 'trendline_up' ? '#3b82f6' : '#f97316';
                            const label = p.type === 'resistance' ? 'RES' :
                                p.type === 'support' ? 'SUP' :
                                p.type === 'trendline_up' ? '↗ TL' : '↘ TL';
                            const confClass = p.confidence > 70 ? 'high' : (p.confidence > 50 ? 'medium' : 'low');

                            html += `
                                <div class="prediction-chip" style="border-color:${color};">
                                    <span class="pred-label" style="color:${color};">${label}</span>
                                    <span class="pred-time">${p.candles} candles</span>
                                    <span class="pred-conf ${confClass}">${p.confidence}%</span>
                                </div>
                            `;
                        }
                    }

                    html += '</div>';
                    html += `
                        <div class="market-legend">
                            <span><span class="dot dot-cons"></span> Consolidation</span>
                            <span><span class="dot dot-dist"></span> Distribution</span>
                            <span><span class="dot dot-manip"></span> Manipulation</span>
                            <span><span class="dot dot-breakup"></span> Breakout Up</span>
                            <span><span class="dot dot-breakdown"></span> Breakout Down</span>
                        </div>
                    `;

                    container.innerHTML = html;
                }

                // ---- PROCESS TICK ----
                function processTick(sym, price, quoteDisplay, epoch, skipRender = false) {
                    if (!marketData[sym]) marketData[sym] = { rollingArray: [], last50Array: [], lastDigit: null,
                        lastPriceDisplay: '—',
                        directions: [], lastPrice: null, priceHistory: [] };
                    let d = marketData[sym];
                    d.lastPriceDisplay = quoteDisplay || formatHistoryPrice(sym, price);
                    d.lastDigit = lastDigitFromFormatted(d.lastPriceDisplay);
                    d.rollingArray.push(d.lastDigit);
                    while (d.rollingArray.length > 2000) d.rollingArray.shift();
                    d.last50Array.push(d.lastDigit);
                    if (d.last50Array.length > 50) d.last50Array.shift();
                    if (d.lastPrice !== null) {
                        d.directions.push(price > d.lastPrice ? 1 : price < d.lastPrice ? -1 : 0);
                        while (d.directions.length > 200) d.directions.shift();
                    }
                    d.lastPrice = price;
                    d.priceHistory.push(price);
                    if (d.priceHistory.length > 2000) d.priceHistory.shift();
                    updateCandle(sym, price);
                    closeCandleIfNeeded(sym);
                    if (d.priceHistory.length % 10 === 0) detectSupportResistance(sym);

                    if (!skipRender) {
                        checkAlarm(sym, price);
                        renderMarket(sym);
                        updateSuggestions();
                    }
                }

                // ---- RENDER MARKET ----
                function renderMarket(sym) {
                    let data = marketData[sym];
                    if (!data || !data.rollingArray.length) return;
                    let last100 = data.rollingArray.slice(-100);
                    let last50 = data.rollingArray.slice(-50);
                    let s = getSettings();
                    const card = document.getElementById(`market_${sym}`);
                    if (!card) return;

                    document.getElementById(`livePriceBig_${sym}`).innerText = data.lastPriceDisplay;
                    document.getElementById(`lastDigit_${sym}`).innerText = data.lastDigit;

                    renderCandleDisplay(sym);

                    let stab = getDigitStability(sym);
                    let stabDiv = document.getElementById(`stability_${sym}`);
                    if (stabDiv && stab) {
                        stabDiv.innerHTML = `<span class="${stab.cssClass}">⚖️ ${stab.label} (avg Δ ${stab.avgDiff.toFixed(2)})</span>`;
                    } else if (stabDiv) {
                        stabDiv.innerHTML = '⚖️ --';
                    }

                    let cond = getMarketCondition(sym);
                    let condDiv = document.getElementById(`condition_${sym}`);
                    if (condDiv && cond) {
                        condDiv.innerHTML = `<span class="${cond.cssClass}">📈 ${cond.label}</span>`;
                    } else if (condDiv) {
                        condDiv.innerHTML = '📈 --';
                    }

                    let zoneMem = document.getElementById(`zoneMemory_${sym}`);
                    if (zoneMem) {
                        const stats = computeZoneMemory(data.rollingArray, s.zoneWindow);
                        if (stats) {
                            const { pct, currentZone, streak, stats3, stats6 } = stats;
                            const pctUnder = pct.under.toFixed(0);
                            const pctMiddle = pct.middle.toFixed(0);
                            const pctOver = pct.over.toFixed(0);
                            const zoneLabel = currentZone.charAt(0).toUpperCase() + currentZone.slice(1);
                            const break3 = stats3.total ? ((stats3.breakout / stats3.total) * 100).toFixed(0) : '?';
                            const bounce3 = stats3.total ? ((stats3.bounce / stats3.total) * 100).toFixed(0) : '?';

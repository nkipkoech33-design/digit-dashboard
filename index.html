                                    `<div class="cp-row"><span class="cp-label">Support</span><span class="cp-value ${sStatus}" style="color:${sColor}">${p.support.level ? p.support.level.toFixed(2) : '—'} ${p.support.distance !== null ? `(${p.support.distance.toFixed(2)}%)` : ''} ${sLabel}</span></div>`;
                                const tStatus = p.trendLine.status;
                                const tLabel = tStatus === 'approaching' ? '🟡 Approaching' :
                                    tStatus === 'broken' ? '🔴 Broken' :
                                    tStatus === 'far' ? '📏 Far' : '—';
                                const tColor = tStatus === 'approaching' ? '#facc15' :
                                    tStatus === 'broken' ? '#f87171' :
                                    '#6b7280';
                                html +=
                                    `<div class="cp-row"><span class="cp-label">Trend Line</span><span class="cp-value ${tStatus}" style="color:${tColor}">${p.trendLine.level ? p.trendLine.level.toFixed(2) : '—'} ${p.trendLine.distance !== null ? `(${p.trendLine.distance.toFixed(2)}%)` : ''} ${tLabel} ${p.trendLine.direction === 'up' ? '↗' : p.trendLine.direction === 'down' ? '↘' : '→'}</span></div>`;
                                const gTrend = p.gmma.trend;
                                const gColor = gTrend === 'bullish' ? '#4ade80' :
                                    gTrend === 'bearish' ? '#f87171' : '#6b7280';
                                const gLabel = gTrend.charAt(0).toUpperCase() + gTrend.slice(1);
                                html +=
                                    `<div class="cp-row"><span class="cp-label">GMMA</span><span class="cp-value" style="color:${gColor}">${gLabel} (spread ${p.gmma.spread.toFixed(2)}%) ${p.gmma.shortGroupExpanding ? '⬆ expanding' : '➡ contracting'}</span></div>`;
                                if (p.resistance.level && p.support.level) {
                                    const range = p.resistance.level - p.support.level;
                                    const pos = ((p.currentPrice - p.support.level) / range) * 100;
                                    const clampedPos = Math.min(100, Math.max(0, pos));
                                    html +=
                                        `<div class="cp-row" style="border-bottom:none;padding-bottom:0;"><span class="cp-label-sm">Price position</span><span class="cp-value-sm">${clampedPos.toFixed(0)}%</span></div><div class="cp-bar-track"><div class="cp-bar-fill ${p.gmma.trend}" style="width:${clampedPos}%;"></div></div>`;
                                }
                                if (p.messages && p.messages.length > 0) {
                                    for (let msg of p.messages) {
                                        const msgColor = msg.includes('Approaching') ? '#facc15' :
                                            msg.includes('waiting for retest') ? '#3b82f6' :
                                            msg.includes('GMMA') ? '#6b7280' : '#4ade80';
                                        html +=
                                            `<div class="cp-row cp-message" style="border-bottom:none;justify-content:center;padding:0.1rem 0;"><span style="color:${msgColor};">${msg}</span></div>`;
                                    }
                                }
                                html += `</div>`;
                            }
                            if (!html) html = `<div class="signal-flash">⏳ Waiting for data...</div>`;
                            sigDiv.innerHTML = html;
                        }
                        document.getElementById(`eoTwo_${sym}`).style.display = 'none';
                        document.getElementById(`pairBias_${sym}`).style.display = 'none';
                        document.getElementById(`groupBias_${sym}`).style.display = 'none';
                        document.getElementById(`transitions_${sym}`).style.display = 'none';
                        document.getElementById(`trendBars_${sym}`).style.display = 'none';
                        renderLetterSequence(sym, data, currentMarket);
                        document.getElementById(`status_${sym}`).innerHTML = '🟢 live';
                        return;
                    }

                    // ---- HYBRID MODE ----
                    if (currentMarket === 'hybrid') {
                        let status = getHybridStatus(sym);
                        let sigDiv = document.getElementById(`signalDisplay_${sym}`);
                        if (sigDiv) {
                            if (status) {
                                let ouLabel = status.ouSide === 'OVER' ? 'Over' : 'Under';
                                let eoLabel = status.eoSide === 'EVEN' ? 'Even' : 'Odd';
                                if (status.bothConfirmed) {
                                    sigDiv.innerHTML =
                                        `<div class="signal-flash" style="color:#4ade80; font-weight:bold;">🎯 ${ouLabel}/${eoLabel} confirmed (${ouLabel} ${status.ouValue.toFixed(0)}% / ${eoLabel} ${status.eoValue.toFixed(0)}%)</div>`;
                                } else {
                                    sigDiv.innerHTML =
                                        `<div class="signal-flash" style="color:${status.ouConfirmed?'#4ade80':'#facc15'};">${ouLabel}: ${status.ouValue.toFixed(0)}% ${status.ouConfirmed?'✅':'⏳'}</div><div class="signal-flash" style="color:${status.eoConfirmed?'#4ade80':'#facc15'};">${eoLabel}: ${status.eoValue.toFixed(0)}% ${status.eoConfirmed?'✅':'⏳'}</div>`;
                                }
                            } else {
                                sigDiv.innerHTML = `<div class="signal-flash">⏳ No direction identified</div>`;
                            }
                        }
                        let groupDiv = document.getElementById(`groupBias_${sym}`);
                        if (groupDiv) {
                            let freq = getDigitPercentages(sym, s.analysisWindow);
                            groupDiv.style.display = 'flex';
                            if (freq) {
                                let g1 = freq.pct[0] + freq.pct[1] + freq.pct[2];
                                let g2 = freq.pct[3] + freq.pct[4] + freq.pct[5] + freq.pct[6];
                                let g3 = freq.pct[7] + freq.pct[8] + freq.pct[9];
                                groupDiv.innerHTML =
                                    `<div class="group-box"><div class="digits">0 1 2</div><div class="pct">${g1.toFixed(1)}%</div></div><div class="group-box"><div class="digits">3 4 5 6</div><div class="pct">${g2.toFixed(1)}%</div></div><div class="group-box"><div class="digits">7 8 9</div><div class="pct">${g3.toFixed(1)}%</div></div>`;
                            } else {
                                groupDiv.innerHTML =
                                    '<div class="group-box">⏳</div><div class="group-box">⏳</div><div class="group-box">⏳</div>';
                            }
                        }
                        document.getElementById(`eoTwo_${sym}`).style.display = 'none';
                        document.getElementById(`pairBias_${sym}`).style.display = 'none';
                        document.getElementById(`transitions_${sym}`).style.display = 'none';
                        document.getElementById(`trendBars_${sym}`).style.display = 'none';
                        renderLetterSequence(sym, data, currentMarket);
                        document.getElementById(`status_${sym}`).innerHTML = '🟢 live';
                        return;
                    }

                    // Default fallback
                    document.getElementById(`status_${sym}`).innerHTML = '🟢 live';
                }

                // ---- UI MECHANICS ----
                function setFocus(sym) {
                    focusedSymbol = sym;
                    document.getElementById('focusBar').style.display = sym ? 'flex' : 'none';
                    let cards = document.querySelectorAll('.market-card');
                    if (sym) {
                        cards.forEach(c => c.style.display = c.id === `market_${sym}` ? 'flex' : 'none');
                    } else {
                        cards.forEach(c => c.style.display = 'flex');
                    }
                    if (sym) {
                        const container = document.getElementById('marketCardsContainer');
                        const card = document.getElementById(`market_${sym}`);
                        if (card && container) {
                            const cardTop = card.offsetTop - container.offsetTop;
                            container.scrollTo({ top: cardTop - 10, behavior: 'smooth' });
                        }
                    }
                }

                function showAllMarkets() { setFocus(null); }

                function applyPointerSettings(ptr, scale) {
                    let style = ptr.style;
                    if (ptr.classList.contains('triangle')) {
                        style.borderLeftWidth = (5 * scale) + 'px';
                        style.borderRightWidth = (5 * scale) + 'px';
                        style.borderBottomWidth = (7 * scale) + 'px';
                    } else if (ptr.classList.contains('arrow')) {
                        style.fontSize = (0.9 * scale) + 'rem';
                    } else if (ptr.classList.contains('dot')) {
                        style.width = (6 * scale) + 'px';
                        style.height = (6 * scale) + 'px';
                    }
                }

                // ---- UPDATE ALL MARKETS LIST ----
                function updateAllMarketsList() {
                    let s = getSettings();
                    let items = [];

                    ALL_SYMBOLS.forEach(sym => {
                        let signal = getSignalForMode(sym, currentMarket);
                        let suffix = '';
                        let hasActiveSignal = false;
                        let signalType = 'neutral';
                        let signalLabel = '';

                        if (currentMarket === 'analysis') {
                            if (signal && signal.signal === 'BUY') {
                                suffix = ` → 🟢 BUY`;
                                hasActiveSignal = true;
                                signalType = 'buy';
                                signalLabel = 'BUY';
                            } else if (signal && signal.signal === 'SELL') {
                                suffix = ` → 🔴 SELL`;
                                hasActiveSignal = true;
                                signalType = 'sell';
                                signalLabel = 'SELL';
                            } else if (signal && signal.signal === 'WATCH') {
                                suffix = ` → 🟡 WATCH`;
                                hasActiveSignal = true;
                                signalType = 'watch';
                                signalLabel = 'WATCH';
                            } else if (signal && signal.signal === 'NEUTRAL') {
                                suffix = ` → ⚪ NEUTRAL`;
                                signalType = 'neutral';
                                signalLabel = 'NEUTRAL';
                            }
                        } else {
                            // other modes
                            if (signal) {
                                hasActiveSignal = true;
                                if (signal.type === 'predict') {
                                    suffix = ` → ${signal.digit} (${signal.percentage.toFixed(1)}%)`;
                                    signalType = 'buy';
                                    signalLabel = signal.digit;
                                } else if (signal.type === 'overunder' || signal.type === 'evenodd') {
                                    suffix = ` → ${signal.side}`;
                                    signalType = (signal.side === 'UNDER' || signal.side === 'EVEN') ? 'buy' : 'sell';
                                    signalLabel = signal.side;
                                } else if (signal.type === 'vanilla' || signal.type === 'confluence') {
                                    suffix = ` → ${signal.side}`;
                                    signalType = (signal.side === 'UP' || signal.side === 'BUY') ? 'buy' : (signal.side ===
                                        'DOWN' || signal.side === 'SELL') ? 'sell' : 'watch';
                                    signalLabel = signal.side;
                                } else if (signal.type === 'hybrid') {
                                    if (signal.bothConfirmed) {
                                        suffix =
                                            ` → ${signal.ouSide}/${signal.eoSide} (${signal.ouValue.toFixed(0)}%/${signal.eoValue.toFixed(0)}%)`;
                                        signalType = 'buy';
                                        signalLabel = signal.ouSide + '/' + signal.eoSide;
                                    } else if (signal.ouConfirmed || signal.eoConfirmed) {
                                        suffix = ` → ${signal.ouSide}/${signal.eoSide} (partial)`;
                                        signalType = 'watch';
                                        signalLabel = 'partial';
                                    }
                                } else {
                                    suffix = ' → signal';
                                    signalType = 'buy';
                                    signalLabel = 'SIG';
                                }
                            }
                        }

                        let badgeHTML = '';
                        if (hasActiveSignal) {
                            const badgeClass = signalType === 'buy' ? '' : (signalType === 'sell' ? 'sell' : (signalType ===
                                'watch' ? 'watch' : 'neutral'));
                            badgeHTML = `<span class="signal-badge ${badgeClass}">${signalLabel}</span>`;
                        }

                        let style = hasActiveSignal ? `background-color: ${s.highlightColor}; color: white;` : '';

                        items.push({
                            sym: sym,
                            html: `<div class="market-list-item" data-symbol="${sym}" style="${style}">
                                    <span>${FULL_NAMES[sym]}${suffix}</span>
                                    ${badgeHTML}
                                </div>`,
                            hasSignal: hasActiveSignal,
                            signalType: signalType
                        });
                    });

                    items.sort((a, b) => {
                        if (a.hasSignal && !b.hasSignal) return -1;
                        if (!a.hasSignal && b.hasSignal) return 1;
                        if (a.hasSignal && b.hasSignal) {
                            const order = { buy: 0, watch: 1, sell: 2, neutral: 3 };
                            return (order[a.signalType] || 4) - (order[b.signalType] || 4);
                        }
                        return 0;
                    });

                    document.getElementById('marketsListContainer').innerHTML = items.map(i => i.html).join('');
                    document.querySelectorAll('.market-list-item').forEach(el => {
                        el.onclick = () => setFocus(el.dataset.symbol);
                    });
                }

                function startTimerRefresh() {
                    if (timerRefresh) clearInterval(timerRefresh);
                    timerRefresh = setInterval(() => {
                        updateAllMarketsList();
                        updateSignalSummary();
                    }, 1000);
                }

                                        <span class="candle-timer" id="candleTimer_${sym}">⏱️ --</span>
                                    </div>

                                    <div class="candle-footer">
                                        <span class="candle-ticks" id="candleStatus_${sym}">⏳</span>
                                        <span class="candle-range" id="candleRange_${sym}">Range: --</span>
                                    </div>
                                </div>
                            </div>`;
                    document.getElementById('marketsContainer').appendChild(card);
                }

                function subscribeToMarket(sym) {
                    if (ws && ws.readyState === WebSocket.OPEN && !invalidSymbols.has(sym)) {
                        ws.send(JSON.stringify({ ticks_history: sym, count: 1000, end: "latest", style: "ticks" }));
                        ws.send(JSON.stringify({ ticks: sym, subscribe: 1 }));
                    }
                }

                // ---- CONNECTION ----
                function connectWebSocket() {
                    if (ws) ws.close();
                    document.getElementById('connectionStatus').innerHTML = '⏳ Connecting...';
                    ws = new WebSocket('wss://api.derivws.com/trading/v1/options/ws/public');
                    ws.onopen = () => {
                        document.getElementById('connectionStatus').innerHTML = '✅ Connected (public feed)';
                        document.getElementById('marketsContainer').innerHTML = '';
                        marketData = {};
                        invalidSymbols.clear();
                        _srCache = {};
                        _lastAlarmTime = {};
                        candleStore = {};
                        ALL_SYMBOLS.forEach(s => createMarketUI(s, FULL_NAMES[s]));
                        let idx = 0;
                        let nextSub = () => {
                            if (idx >= ALL_SYMBOLS.length) {
                                document.getElementById('connectionStatus').innerHTML = `✅ ${currentMarket.toUpperCase()}`;
                                startCandleTimer();
                                return;
                            }
                            subscribeToMarket(ALL_SYMBOLS[idx]);
                            idx++;
                            setTimeout(nextSub, 200);
                        };
                        nextSub();
                        startTimerRefresh();
                    };
                    ws.onmessage = e => {
                        try {
                            let msg = JSON.parse(e.data);
                            if (msg.error && msg.error.code === 'InvalidSymbol' && msg.echo_req?.ticks_history) {
                                let sym = msg.echo_req.ticks_history;
                                if (MARKET_NAMES[sym]) invalidSymbols.add(sym);
                            } else if (msg.msg_type === 'tick' && msg.tick) {
                                let sym = msg.tick.symbol;
                                if (MARKET_NAMES[sym] && !invalidSymbols.has(sym)) {
                                    processTick(sym, msg.tick.quote, msg.tick.quote_display, msg.tick.epoch);
                                    document.getElementById(`status_${sym}`).innerHTML = '🟢 live';
                                }
                            } else if (msg.msg_type === 'history' && msg.history?.prices && msg.echo_req?.ticks_history) {
                                let sym = msg.echo_req.ticks_history;
                                if (MARKET_NAMES[sym] && !invalidSymbols.has(sym)) {
                                    msg.history.prices.forEach((p, i) => processTick(sym, p, null, Date.now() - (msg.history
                                        .prices.length - i) * 1000));
                                }
                            }
                        } catch (err) {}
                    };
                    ws.onerror = () => { document.getElementById('connectionStatus').innerHTML = '⚠️ Error'; };
                    ws.onclose = () => { document.getElementById('connectionStatus').innerHTML = '🔴 Disconnected'; };
                }

                function toggleMode() { document.body.classList.toggle('light'); }

                function setMarket(m) {
                    currentMarket = m;
                    setFocus(null);
                    document.querySelectorAll('.market-btn').forEach(b => b.classList.toggle('active', b.dataset.market === m));
                    const showStrategy = (m === 'evenodd' || m === 'hybrid');
                    document.getElementById('strategySelector').style.display = showStrategy ? 'flex' : 'none';
                    for (let s in marketData)
                        if (marketData[s]?.rollingArray?.length) renderMarket(s);
                    updateAllMarketsList();
                    updateSignalSummary();
                }

                function setStrategy(str) {
                    currentStrategy = str;
                    document.querySelectorAll('.strategy-btn').forEach(b => b.classList.toggle('active', b.dataset.strategy ===
                        str));
                    for (let s in marketData)
                        if (marketData[s]?.rollingArray?.length) renderMarket(s);
                    updateAllMarketsList();
                    updateSignalSummary();
                }

                let candleTimerInterval;

                function startCandleTimer() {
                    if (candleTimerInterval) clearInterval(candleTimerInterval);
                    candleTimerInterval = setInterval(() => {
                        for (const sym of ALL_SYMBOLS) {
                            if (marketData[sym] && marketData[sym].rollingArray && marketData[sym].rollingArray.length >
                                0) {
                                closeCandleIfNeeded(sym);
                                renderCandleDisplay(sym);
                            }
                        }
                    }, 1000);
                }

                // ---- GET SIGNAL FOR MODE ----
                function getSignalForMode(sym, mode) {
                    if (mode === 'analysis') {
                        const data = marketData[sym];
                        if (data && data.analysisResult) return data.analysisResult;
                        return null;
                    }
                    if (mode === 'predict') return getPredictSignal(sym);
                    else if (mode === 'overunder') return getOverUnderSignal(sym);
                    else if (mode === 'evenodd') return getEvenOddSignal(sym);
                    else if (mode === 'vanilla') {
                        let signals = getVanillaSignals(sym);
                        let best = null;
                        for (let s of signals) {
                            if (s.type === 'confluence' && (s.side === 'BUY' || s.side === 'SELL')) {
                                if (!best || best.side !== 'BUY') best = s;
                            }
                            if (s.type === 'vanilla' && (s.side === 'UP' || s.side === 'DOWN')) {
                                if (!best || best.side !== 'BUY') best = s;
                            }
                            if (s.type === 'confluence_progress') continue;
                        }
                        if (best) return best;
                        return signals.length > 0 ? signals[0] : null;
                    } else if (mode === 'hybrid') return getHybridStatus(sym);
                    return null;
                }

                // ---- UPDATE SIGNAL SUMMARY ----
                function updateSignalSummary() {
                    const container = document.getElementById('signalSummaryContent');
                    const bar = document.getElementById('signalSummaryBar');
                    if (!container) return;

                    let signalGroups = [];

                    for (let sym of ALL_SYMBOLS) {
                        let hasData = marketData[sym] && marketData[sym].rollingArray && marketData[sym].rollingArray.length >
                            10;
                        if (!hasData) continue;

                        let modeStatus = {};
                        let hasSignal = false;

                        for (let mode of MODE_LABELS) {
                            let sig = getSignalForMode(sym, mode);
                            let status = 'none';
                            if (sig) {
                                if (sig.type === 'predict' || sig.type === 'overunder' || sig.type === 'evenodd') {
                                    if (sig.side === 'UNDER' || sig.side === 'EVEN' || sig.side === 'BUY') status = 'buy';
                                    else if (sig.side === 'OVER' || sig.side === 'ODD' || sig.side === 'SELL') status =
                                    'sell';
                                    else if (sig.side === 'WATCH') status = 'watch';
                                } else if (sig.type === 'vanilla' || sig.type === 'confluence') {
                                    if (sig.side === 'UP' || sig.side === 'BUY') status = 'buy';
                                    else if (sig.side === 'DOWN' || sig.side === 'SELL') status = 'sell';
                                    else if (sig.side === 'WATCH') status = 'watch';
                                } else if (sig.type === 'hybrid' || sig.bothConfirmed) {
                                    if (sig.bothConfirmed) status = 'buy';
                                    else if (sig.ouConfirmed || sig.eoConfirmed) status = 'watch';
                                } else if (sig.type === 'analysis') {
                                    if (sig.signal === 'BUY') status = 'buy';
                                    else if (sig.signal === 'SELL') status = 'sell';
                                    else if (sig.signal === 'WATCH') status = 'watch';
                                    else if (sig.signal === 'NEUTRAL') status = 'none';
                                } else {
                                    if (sig.side === 'BUY' || sig.side === 'UP' || sig.side === 'UNDER' || sig.side ===
                                        'EVEN') status = 'buy';
                                    else if (sig.side === 'SELL' || sig.side === 'DOWN' || sig.side === 'OVER' || sig
                                        .side === 'ODD') status = 'sell';
                                    else if (sig.side === 'WATCH') status = 'watch';
                                }
                            }
                            modeStatus[mode] = status;
                            if (status !== 'none') hasSignal = true;
                        }

                        if (hasSignal) {
                            signalGroups.push({ sym, modes: modeStatus });
                        }
                    }

                    if (signalGroups.length === 0) {
                        bar.classList.remove('visible');
                        container.innerHTML = '';
                        return;
                    }

                    bar.classList.add('visible');

                    let html = '';
                    for (let group of signalGroups) {
                        let cells = '';
                        for (let mode of MODE_LABELS) {
                            let status = group.modes[mode] || 'none';
                            if (status === 'none') continue;
                            let cls = status === 'buy' ? 'buy' : (status === 'sell' ? 'sell' : (status === 'watch' ?
                                'watch' : ''));
                            let display = status === 'buy' ? 'B' : (status === 'sell' ? 'S' : (status === 'watch' ?
                                'W' : ''));
                            let short = MODE_SHORT[mode] || mode;
                            cells +=
                            `<span class="summary-mode-cell ${cls}" title="${short}: ${status.toUpperCase()}">${display}</span>`;
                        }

                        if (cells) {
                            html += `<div class="summary-market-group" onclick="setFocus('${group.sym}')" title="${FULL_NAMES[group.sym]}">
                                        <span class="market-name">${MARKET_NAMES[group.sym]}</span>
                                        ${cells}
                                    </div>`;
                        }
                    }

                    container.innerHTML = html;
                }

                // ---- PROCESS TICK ----
                function processTick(sym, price, quoteDisplay, epoch) {
                    if (!marketData[sym]) marketData[sym] = {
                        rollingArray: [],
                        last50Array: [],
                        lastDigit: null,
                        lastPriceDisplay: '—',
                        directions: [],
                        lastPrice: null,
                        priceHistory: [],
                        analysisResult: null
                    };
                    let d = marketData[sym];
                    d.lastPriceDisplay = quoteDisplay || formatHistoryPrice(sym, price);
                    d.lastDigit = lastDigitFromFormatted(d.lastPriceDisplay);
                    d.rollingArray.push(d.lastDigit);
                    while (d.rollingArray.length > 2000) d.rollingArray.shift();
                    d.last50Array.push(d.lastDigit);
                    if (d.last50Array.length > 50) d.last50Array.shift();
                    if (d.lastPrice !== null) {
                        d.directions.push(price > d.lastPrice ? 1 : price < d.lastPrice ? -1 : 0);
                        while (d.directions.length > 100) d.directions.shift();
                    }
                    d.lastPrice = price;
                    d.priceHistory.push(price);
                    if (d.priceHistory.length > 500) d.priceHistory.shift();

                    if (d.priceHistory.length % 10 === 0) {
                        const sr = detectSupportResistance(sym);
                        if (sr) _srCache[sym] = sr;
                    }

                    updateCandle(sym, price);
                    closeCandleIfNeeded(sym);

                    const candle = getCandle(sym);
                    if (candle.history.length >= 10 && (candle.isClosed || candle.tickCount > 10)) {
                        updateAnalysisForSymbol(sym);
                    }

                    if (document.getElementById('alarmToggle').checked && currentMarket === 'analysis') {
                        const anSig = d.analysisResult;
                        if (anSig && (anSig.signal === 'BUY' || anSig.signal === 'SELL' || anSig.signal === 'WATCH')) {
                            const now = Date.now();
                            const last = _lastAlarmTime['analysis_' + sym] || 0;
                            const s = getSettings();
                            if ((now - last) > s.alarmCooldown * 1000) {
                                playAlarm();
                                _lastAlarmTime['analysis_' + sym] = now;
                            }
                        }
                    }

                    checkAlarm(sym, price);
                    renderMarket(sym);
                }

                // ---- INIT ----
                document.querySelectorAll('.market-btn').forEach(b => b.onclick = () => setMarket(b.dataset.market));
                document.querySelectorAll('.strategy-btn').forEach(b => b.onclick = () => setStrategy(b.dataset.strategy));
                document.getElementById('showAllBtn')?.addEventListener('click', showAllMarkets);
                document.getElementById('settingsBtn').onclick = () => document.getElementById('settingsModal').style.display =
                    'flex';
                document.getElementById('closeModal').onclick = () => document.getElementById('settingsModal').style.display =
                    'none';
                window.onclick = e => { if (e.target === document.getElementById('settingsModal')) document.getElementById(
                        'settingsModal').style.display = 'none'; };

                // Settings change refresh
                ['smaPeriod', 'rsiPeriod', 'slopePeriod', 'angleThreshold', 'angleWatchThreshold',
                    'predThreshold', 'oppositeThreshold', 'streakThreshold', 'hybridThreshold'
                ].forEach(id => {
                    document.getElementById(id)?.addEventListener('change', () => {
                        for (let s in marketData)
                            if (marketData[s]?.rollingArray?.length) renderMarket(s);
                        updateAllMarketsList();
                        updateSignalSummary();
                    });
                });

                setTimeout(connectWebSocket, 500);
                setMarket('analysis');

                console.log('✅ FIXED: Digit grid uses full analysisWindow (1000) for percentages; pointer moves on every tick in all modes.');
            } catch (err) {
                console.error('Error initializing app:', err);
                document.body.innerHTML =
                    `<div style="color:red;padding:20px;font-size:16px;">Error loading UI. Please refresh. Details: ${err.message}</div>`;
            }
        })();
    </script>
</body>
